<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="입력창 왼쪽 아래 + 버튼과 파일이나 사진 추가 메뉴, 붙은 사진 표시를 단순하게 그린 화면 스케치">
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .m{font-size:20px;font-weight:600}
    .a{font-size:20px;font-weight:600;fill:#5e6ad2}
    .c{font-size:18px}
    .s{font-size:18px;fill:#6b7078}
    .n{font-size:18px;font-weight:700;fill:#ffffff}
  </style>
  <rect width="720" height="400" rx="16" fill="#f5f6f6"/>

  <!-- schematic window -->
  <rect x="32" y="20" width="656" height="316" rx="14" fill="#ffffff"/>
  <path d="M46 20 H674 A14 14 0 0 1 688 34 V54 H32 V34 A14 14 0 0 1 46 20 Z" fill="#eceef0"/>
  <rect x="32" y="20" width="656" height="316" rx="14" fill="none" stroke="#e4e4e8" stroke-width="1.5"/>

  <rect x="436" y="78" width="220" height="14" rx="7" fill="#eceef0"/>
  <rect x="516" y="102" width="140" height="14" rx="7" fill="#eceef0"/>

  <!-- popup menu that opens from + -->
  <rect x="68" y="70" width="304" height="104" rx="12" fill="#e4e4e8"/>
  <rect x="64" y="66" width="304" height="104" rx="12" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <rect x="72" y="74" width="288" height="60" rx="9" fill="#e8eafb" stroke="#5e6ad2" stroke-width="2"/>
  <rect x="84" y="94" width="24" height="20" rx="3" fill="#ffffff" stroke="#5e6ad2" stroke-width="1.5"/>
  <path d="M87 111 L94 103 L99 108 L102 105 L106 111" fill="none" stroke="#5e6ad2" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="102" cy="99" r="2" fill="#5e6ad2"/>
  <text class="m" x="120" y="100">Add files or photos</text>
  <text class="s" x="120" y="124">(파일이나 사진 추가)</text>
  <circle cx="334" cy="104" r="14" fill="#5e6ad2"/><text class="n" x="334" y="110" text-anchor="middle">2</text>
  <circle cx="96" cy="152" r="8" fill="none" stroke="#9da2a9" stroke-width="1.5"/>
  <rect x="120" y="146" width="120" height="12" rx="6" fill="#e4e4e8"/>

  <!-- attached photo chip -->
  <rect x="64" y="186" width="176" height="38" rx="10" fill="#f5f6f6" stroke="#c9ccd2" stroke-width="1.5"/>
  <rect x="76" y="195" width="24" height="20" rx="3" fill="#ffffff" stroke="#6b7078" stroke-width="1.5"/>
  <path d="M79 212 L86 204 L91 209 L94 206 L98 212" fill="none" stroke="#6b7078" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="94" cy="200" r="2" fill="#6b7078"/>
  <text class="c" x="110" y="211">가격표.jpg</text>
  <path d="M217 200 L227 210 M227 200 L217 210" stroke="#6b7078" stroke-width="2" stroke-linecap="round"/>
  <path d="M248 205 H280" stroke="#5e6ad2" stroke-width="2"/>
  <circle cx="284" cy="205" r="3.5" fill="#5e6ad2"/>
  <text class="a" x="296" y="212">붙은 사진</text>

  <!-- message box: + at the lower left, send at the lower right -->
  <rect x="64" y="238" width="592" height="68" rx="20" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5"/>
  <circle cx="100" cy="272" r="22" fill="none" stroke="#5e6ad2" stroke-width="2.5"/>
  <circle cx="100" cy="272" r="15" fill="#ffffff" stroke="#6b7078" stroke-width="1.5"/>
  <path d="M100 265 V279 M93 272 H107" stroke="#6b7078" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="142" cy="272" r="14" fill="#5e6ad2"/><text class="n" x="142" y="278" text-anchor="middle">1</text>
  <rect x="172" y="265" width="240" height="14" rx="7" fill="#e4e4e8"/>
  <circle cx="620" cy="272" r="16" fill="#ffffff" stroke="#6b7078" stroke-width="1.5"/>
  <path d="M620 280 V264 M613 270 L620 263 L627 270" fill="none" stroke="#6b7078" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- notes under the window -->
  <g fill="none" stroke="#6b7078" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M38 352 H50 L56 358 V376 H38 Z"/>
    <path d="M60 368 H72 M68 364 L72 368 L68 372"/>
  </g>
  <text class="s" x="82" y="373">끌어다 놓아도 돼요</text>
  <text class="s" x="656" y="373" text-anchor="end">실제 화면은 조금 다를 수 있어요</text>
</svg>
