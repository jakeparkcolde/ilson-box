<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="답을 고치는 세 가지 방법인 이어서 말하기, 같은 부탁 다시 보내기, 새 대화로 처음부터를 언제 쓰는지 정리한 카드">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7078" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .l{font-size:20px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .tk{font-size:19px;font-weight:600;fill:#5e6ad2}
  </style>
  <rect width="720" height="380" rx="16" fill="#f5f6f6"/>

  <!-- card 1: continue talking -->
  <rect x="32" y="32" width="204" height="204" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <path d="M114 62 H150 A10 10 0 0 1 160 72 V94 A10 10 0 0 1 150 104 H124 L112 114 L114 104 A10 10 0 0 1 104 94 V72 A10 10 0 0 1 114 62 Z" fill="#e8eafb" stroke="#5e6ad2" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M116 78 H146 M116 89 H136" stroke="#5e6ad2" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="translate(164 98) rotate(45)">
    <rect x="-5.5" y="-24" width="11" height="30" rx="2" fill="#ffffff" stroke="#5e6ad2" stroke-width="2.5"/>
    <path d="M-5.5 6 L0 16 L5.5 6 Z" fill="#5e6ad2" stroke="#5e6ad2" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text class="l" x="134" y="156" text-anchor="middle">이어서 말하기</text>
  <text class="s" x="134" y="186" text-anchor="middle">조금만 바꿀 때</text>

  <!-- card 2: send the same request again -->
  <rect x="258" y="32" width="204" height="204" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <path d="M332 58 H364 A9 9 0 0 1 373 67 V84 A9 9 0 0 1 364 93 H342 L332 101 L333 93 A9 9 0 0 1 324 84 V67 A9 9 0 0 1 333 58 Z" fill="#ffffff" stroke="#5e6ad2" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M356 76 H388 A9 9 0 0 1 397 85 V102 A9 9 0 0 1 388 111 H366 L356 119 L357 111 A9 9 0 0 1 348 102 V85 A9 9 0 0 1 357 76 Z" fill="#e8eafb" stroke="#5e6ad2" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M358 90 H386 M358 99 H376" stroke="#5e6ad2" stroke-width="2.5" stroke-linecap="round"/>
  <text class="l" x="360" y="156" text-anchor="middle">같은 부탁 다시 보내기</text>
  <text class="s" x="360" y="186" text-anchor="middle">여러 개 받아 고를 때</text>

  <!-- card 3: new chat from the start -->
  <rect x="484" y="32" width="204" height="204" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <path d="M566 58 H596 L610 72 V112 A4 4 0 0 1 606 116 H566 A4 4 0 0 1 562 112 V62 A4 4 0 0 1 566 58 Z" fill="#ffffff" stroke="#5e6ad2" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M596 58 V72 H610" fill="none" stroke="#5e6ad2" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="610" cy="112" r="12" fill="#5e6ad2"/>
  <path d="M610 105 V119 M603 112 H617" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text class="l" x="586" y="156" text-anchor="middle">새 대화로 처음부터</text>
  <text class="s" x="586" y="186" text-anchor="middle">엉키거나</text>
  <text class="s" x="586" y="212" text-anchor="middle">전혀 다른 글이 필요할 때</text>

  <!-- scale: how much you change -->
  <path d="M134 240 V262 M360 240 V262 M586 240 V262" stroke="#c9ccd2" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="M48 272 H668" stroke="#6b7078" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="134" cy="272" r="5" fill="#5e6ad2"/>
  <circle cx="360" cy="272" r="8" fill="#5e6ad2"/>
  <circle cx="586" cy="272" r="11" fill="#5e6ad2"/>
  <text class="tk" x="134" y="308" text-anchor="middle">조금</text>
  <text class="tk" x="360" y="308" text-anchor="middle">중간</text>
  <text class="tk" x="586" y="308" text-anchor="middle">많이</text>
  <text class="s" x="360" y="350" text-anchor="middle">바꾸는 정도</text>
</svg>
