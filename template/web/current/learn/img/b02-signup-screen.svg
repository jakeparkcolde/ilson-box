<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="로그인 화면을 단순하게 그린 스케치로, 구글로 계속과 이메일로 계속 버튼 두 개가 보이는 그림">
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .btn{font-size:19px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .c{font-size:18px;font-weight:500}
  </style>
  <rect width="720" height="440" rx="16" fill="#f5f6f6"/>

  <!-- browser window (generic) -->
  <rect x="32" y="32" width="400" height="340" rx="12" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <path d="M32 76 V 44 A12 12 0 0 1 44 32 H 420 A12 12 0 0 1 432 44 V 76 Z" fill="#eceef0"/>
  <g fill="#6b7078" opacity="0.45">
    <circle cx="52" cy="54" r="5"/><circle cx="68" cy="54" r="5"/><circle cx="84" cy="54" r="5"/>
  </g>
  <rect x="104" y="41" width="312" height="26" rx="13" fill="#ffffff"/>
  <text class="s" x="120" y="60">claude.ai</text>

  <!-- placeholder where a mark would be: plain grey circle, not a logo -->
  <circle cx="232" cy="114" r="22" fill="#e4e4e8"/>
  <rect x="162" y="146" width="140" height="10" rx="5" fill="#e4e4e8"/>

  <!-- button 1 -->
  <rect x="64" y="172" width="336" height="50" rx="12" fill="#ffffff" stroke="#5e6ad2" stroke-width="2"/>
  <circle cx="94" cy="197" r="12" fill="none" stroke="#6b7078" stroke-width="1.8"/>
  <circle cx="94" cy="193" r="4" fill="#6b7078"/>
  <path d="M86.5 205 C 88 200.5, 100 200.5, 101.5 205" fill="none" stroke="#6b7078" stroke-width="1.8" stroke-linecap="round"/>
  <text class="btn" x="244" y="204" text-anchor="middle">Continue with Google</text>
  <text class="s" x="232" y="250" text-anchor="middle">(구글로 계속)</text>

  <!-- button 2 -->
  <rect x="64" y="270" width="336" height="50" rx="12" fill="#ffffff" stroke="#5e6ad2" stroke-width="2"/>
  <rect x="82" y="287" width="24" height="17" rx="3" fill="none" stroke="#6b7078" stroke-width="1.8"/>
  <path d="M83.5 289 L 94 297 L 104.5 289" fill="none" stroke="#6b7078" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="btn" x="244" y="302" text-anchor="middle">Continue with email</text>
  <text class="s" x="232" y="348" text-anchor="middle">(이메일로 계속)</text>

  <!-- callouts -->
  <g stroke="#6b7078" stroke-width="1.5">
    <path d="M400 197 H 464"/>
    <path d="M400 295 H 464"/>
  </g>
  <circle cx="400" cy="197" r="3.5" fill="#6b7078"/>
  <circle cx="400" cy="295" r="3.5" fill="#6b7078"/>
  <rect x="464" y="175" width="224" height="44" rx="12" fill="#e8eafb" stroke="#5e6ad2" stroke-width="1.5"/>
  <text class="c" x="576" y="203" text-anchor="middle">구글 계정으로 바로</text>
  <rect x="464" y="273" width="224" height="44" rx="12" fill="#e8eafb" stroke="#5e6ad2" stroke-width="1.5"/>
  <text class="c" x="576" y="301" text-anchor="middle">메일로 온 링크를 눌러요</text>

  <text class="s" x="232" y="408" text-anchor="middle">실제 화면은 조금 다를 수 있어요</text>
</svg>
