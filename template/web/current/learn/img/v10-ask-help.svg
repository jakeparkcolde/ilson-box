<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-label="손님 정보가 위험한지, 새 기능이 필요한지, 오류가 두 번 넘게 안 풀리는지 차례로 묻고, 위험하면 열쇠 지우기와 개발자, 새 기능이나 안 풀리는 오류는 개발자, 나머지는 Claude에게 먼저 묻는 판단 그림">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7078" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .q{font-size:20px;font-weight:600}
    .l{font-size:20px;font-weight:600}
    .c{font-size:18px}
    .s{font-size:18px;fill:#6b7078}
    .y{font-size:18px;font-weight:600;fill:#6b7078}
    .qp{fill:#ffffff;stroke:#e4e4e8;stroke-width:1.5}
    .fo{fill:#e8eafb;stroke:#5e6ad2;stroke-width:1.5}
    .a{stroke:#6b7078;stroke-width:2;fill:none}
  </style>
  <rect width="720" height="460" rx="16" fill="#f5f6f6"/>

  <!-- Q1 -->
  <rect class="qp" x="32" y="36" width="324" height="72" rx="18"/>
  <text class="q" x="194" y="66" text-anchor="middle">손님 정보가 위험한가요?</text>
  <text class="s" x="194" y="92" text-anchor="middle">(secret key 유출, 스팸 폭주)</text>
  <path class="a" d="M360 72 H406" marker-end="url(#arrow)"/>
  <text class="y" x="383" y="62" text-anchor="middle">예</text>
  <rect x="412" y="20" width="188" height="104" rx="12" fill="#f8e3e1" stroke="#c4423b" stroke-width="2"/>
  <text class="l" x="506" y="52" text-anchor="middle">바로: 열쇠 지우기 ·</text>
  <text class="l" x="506" y="78" text-anchor="middle">화면 안내 바꾸기</text>
  <text class="c" x="506" y="106" text-anchor="middle">그리고 개발자에게</text>

  <path class="a" d="M194 108 V150" marker-end="url(#arrow)"/>
  <text class="y" x="206" y="135">아니요</text>

  <!-- Q2 -->
  <rect class="qp" x="32" y="156" width="324" height="72" rx="18"/>
  <text class="q" x="194" y="186" text-anchor="middle">새 기능이 필요한가요?</text>
  <text class="s" x="194" y="212" text-anchor="middle">(결제, 회원 가입, 메일)</text>
  <path class="a" d="M360 192 H406" marker-end="url(#arrow)"/>
  <text class="y" x="383" y="182" text-anchor="middle">예</text>
  <rect class="fo" x="412" y="168" width="188" height="48" rx="12"/>
  <text class="l" x="506" y="199" text-anchor="middle">개발자에게</text>

  <path class="a" d="M194 228 V270" marker-end="url(#arrow)"/>
  <text class="y" x="206" y="255">아니요</text>

  <!-- Q3 -->
  <rect class="qp" x="32" y="276" width="324" height="52" rx="18"/>
  <text class="q" x="194" y="309" text-anchor="middle">안전한 방법 두 번으로 안 풀리나요?</text>
  <path class="a" d="M360 302 H406" marker-end="url(#arrow)"/>
  <text class="y" x="383" y="292" text-anchor="middle">예</text>
  <rect class="fo" x="412" y="278" width="188" height="48" rx="12"/>
  <text class="l" x="506" y="309" text-anchor="middle">개발자에게</text>

  <path class="a" d="M194 328 V370" marker-end="url(#arrow)"/>
  <text class="y" x="206" y="355">아니요</text>

  <!-- otherwise -->
  <rect x="75" y="376" width="238" height="52" rx="12" fill="#e6f3e9" stroke="#1d8a38" stroke-width="2"/>
  <text class="l" x="194" y="409" text-anchor="middle">Claude에게 먼저 물어요</text>
</svg>
