<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="개인 창의 예약 화면에서 보낸 요청은 Supabase 예약 표에 한 줄로 들어가고, 같은 손님이 표를 읽으려 하면 42501로 거절되는 그림">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7078" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1d8a38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .l{font-size:20px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .m{font-family:'SF Mono',Menlo,monospace;font-size:18px}
  </style>
  <rect width="720" height="380" rx="16" fill="#f5f6f6"/>

  <!-- private window (generic) -->
  <rect x="32" y="40" width="260" height="198" rx="12" fill="#ffffff"/>
  <path d="M32 76 V52 Q32 40 44 40 H280 Q292 40 292 52 V76 Z" fill="#62666d"/>
  <circle cx="50" cy="58" r="4.5" fill="#9a9ea6"/><circle cx="66" cy="58" r="4.5" fill="#9a9ea6"/><circle cx="82" cy="58" r="4.5" fill="#9a9ea6"/>
  <text x="102" y="64" style="font-size:18px;font-weight:600;fill:#ffffff">개인 창</text>
  <rect x="32" y="40" width="260" height="198" rx="12" fill="none" stroke="#e4e4e8" stroke-width="1.5"/>
  <rect x="52" y="96" width="180" height="12" rx="6" fill="#e4e4e8"/>
  <rect x="52" y="120" width="140" height="12" rx="6" fill="#e4e4e8"/>
  <rect x="52" y="144" width="220" height="44" rx="10" fill="#5e6ad2"/>
  <text x="162" y="173" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#ffffff">예약 요청 보내기</text>
  <text x="52" y="220" style="font-size:18px;font-weight:600;fill:#1d8a38">예약 요청을 받았어요.</text>

  <!-- send -->
  <path d="M300 166 H394" stroke="#1d8a38" stroke-width="2" fill="none" marker-end="url(#arrowG)"/>
  <text class="l" x="348" y="152" text-anchor="middle" style="fill:#1d8a38">보내기</text>

  <!-- the table: one new row -->
  <rect x="404" y="100" width="284" height="134" rx="14" fill="#ffffff" stroke="#1d8a38" stroke-width="2"/>
  <text class="m" x="424" y="138">reservation_requests</text>
  <path d="M405 154 H687" stroke="#e4e4e8" stroke-width="1.5"/>
  <rect x="420" y="170" width="252" height="44" rx="8" fill="#e6f3e9"/>
  <text class="l" x="436" y="199">연습 손님 · 새 요청</text>

  <!-- read attempt: refused, and that is what we want -->
  <path d="M162 246 V304 H312" stroke="#6b7078" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M322 288 V320" stroke="#1d1d21" stroke-width="4" stroke-linecap="round"/>
  <text class="l" x="178" y="292">읽기 시도</text>
  <text x="344" y="312" style="font-family:'SF Mono',Menlo,monospace;font-size:20px;font-weight:600">42501</text>
  <text class="m" x="344" y="342" style="fill:#6b7078">permission denied</text>
  <rect x="420" y="290" width="112" height="30" rx="15" fill="#e6f3e9"/>
  <text x="476" y="311" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#1d8a38">바라던 결과</text>
</svg>
