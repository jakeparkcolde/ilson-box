<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="한도에 가까워졌으면 가볍게 쓰기, 다 썼으면 급하지 않을 때 기다리기, 급할 때 사용 크레딧이나 요금제 올리기로 가는 선택 그림">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7078" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="lightCard">
      <rect x="32" y="186" width="224" height="148" rx="14"/>
    </clipPath>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .h{font-size:22px;font-weight:700}
    .l{font-size:20px;font-weight:600}
    .b{font-size:18px;font-weight:500}
    .s{font-size:18px;fill:#6b7078}
    .m{font-family:'SF Mono',Menlo,monospace;font-size:18px;fill:#6b7078}
  </style>
  <rect width="720" height="470" rx="16" fill="#f5f6f6"/>

  <!-- level 0 -->
  <rect x="224" y="24" width="194" height="40" rx="20" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="l" x="321" y="51" text-anchor="middle">한도 문구가 보여요</text>

  <g fill="none" stroke="#6b7078" stroke-width="2" stroke-linecap="round">
    <path d="M321 64 V 72 Q 321 80 313 80 H 152 Q 144 80 144 88 V 94" marker-end="url(#arrow)"/>
    <path d="M321 72 Q 321 80 329 80 H 490 Q 498 80 498 88 V 94" marker-end="url(#arrow)"/>
    <path d="M144 164 V 180" marker-end="url(#arrow)"/>
    <path d="M498 164 V 180" marker-end="url(#arrow)"/>
    <path d="M498 224 V 234 Q 498 242 490 242 H 400 Q 392 242 392 250 V 260" marker-end="url(#arrow)"/>
    <path d="M498 234 Q 498 242 506 242 H 596 Q 604 242 604 250 V 260" marker-end="url(#arrow)"/>
  </g>

  <!-- level 1: approaching (careful) -->
  <rect x="54" y="100" width="180" height="64" rx="14" fill="#f8efdc" stroke="#a3720a" stroke-width="1.5"/>
  <text class="l" x="144" y="126" text-anchor="middle" style="fill:#a3720a">가까워졌어요</text>
  <text class="m" x="144" y="152" text-anchor="middle">Approaching …</text>

  <!-- level 1: used up -->
  <rect x="408" y="100" width="180" height="64" rx="14" fill="#ffffff" stroke="#1d1d21" stroke-width="1.5"/>
  <text class="l" x="498" y="126" text-anchor="middle">다 썼어요</text>
  <text class="m" x="498" y="152" text-anchor="middle">limit reached</text>

  <!-- result: use it lightly -->
  <rect x="32" y="186" width="224" height="148" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <rect x="32" y="186" width="7" height="148" fill="#a3720a" clip-path="url(#lightCard)"/>
  <text class="h" x="58" y="220">가볍게 쓰기</text>
  <g fill="#6b7078">
    <circle cx="63" cy="247" r="3"/><circle cx="63" cy="276" r="3"/><circle cx="63" cy="305" r="3"/>
  </g>
  <text class="b" x="75" y="253">새 대화로 짧게</text>
  <text class="b" x="75" y="282">비슷한 부탁은 모아서</text>
  <text class="b" x="75" y="311">앱 연결·웹 검색 끄기</text>

  <!-- level 2 question -->
  <rect x="420" y="186" width="156" height="38" rx="19" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="l" x="498" y="212" text-anchor="middle">급한 일인가요?</text>
  <text class="s" x="376" y="255" text-anchor="end">네</text>
  <text class="s" x="620" y="255">아니요</text>

  <!-- urgent: credits (paid plans) or upgrade -->
  <rect x="284" y="266" width="216" height="176" rx="14" fill="#e8eafb" stroke="#5e6ad2" stroke-width="1.5"/>
  <text class="h" x="392" y="300" text-anchor="middle">사용 크레딧</text>
  <text class="s" x="392" y="327" text-anchor="middle">유료 요금제</text>
  <text class="s" x="392" y="353" text-anchor="middle">한 달 상한은 작게</text>
  <path d="M300 368 H 484" stroke="#5e6ad2" stroke-opacity="0.3" stroke-width="1.5"/>
  <text class="h" x="392" y="402" text-anchor="middle">요금제 올리기</text>
  <text class="s" x="392" y="430" text-anchor="middle">바로 적용돼요</text>

  <!-- not urgent: wait (the calm default) -->
  <rect x="520" y="266" width="168" height="78" rx="14" fill="#e6f3e9" stroke="#1d8a38" stroke-width="2"/>
  <text class="h" x="604" y="300" text-anchor="middle" style="fill:#1d8a38">기다리기</text>
  <text class="s" x="604" y="329" text-anchor="middle">적힌 시각에 다시</text>
</svg>
