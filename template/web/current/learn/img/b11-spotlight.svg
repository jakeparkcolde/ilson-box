<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="⌘와 스페이스 바를 누르고 검색창에 터미널을 친 뒤 return을 누르는 화면 스케치">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7078" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .l{font-size:21px;font-weight:600}
    .k{font-size:20px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .n{font-size:18px;font-weight:700;fill:#ffffff}
  </style>
  <rect width="720" height="420" rx="16" fill="#f5f6f6"/>

  <!-- 1: key presses -->
  <circle cx="48" cy="62" r="14" fill="#5e6ad2"/><text class="n" x="48" y="68" text-anchor="middle">1</text>
  <rect x="80" y="40" width="168" height="50" rx="10" fill="#d9dbe0"/>
  <rect x="80" y="36" width="168" height="50" rx="10" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
  <text class="k" x="164" y="68" text-anchor="middle">⌘ command</text>
  <text x="270" y="70" text-anchor="middle" style="font-size:24px;font-weight:600;fill:#6b7078">+</text>
  <rect x="292" y="40" width="260" height="50" rx="10" fill="#d9dbe0"/>
  <rect x="292" y="36" width="260" height="50" rx="10" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
  <text class="k" x="422" y="68" text-anchor="middle">스페이스 바</text>

  <!-- 2: search window (generic) -->
  <circle cx="48" cy="198" r="14" fill="#5e6ad2"/><text class="n" x="48" y="204" text-anchor="middle">2</text>
  <rect x="80" y="114" width="608" height="172" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <circle cx="111" cy="142" r="9" fill="none" stroke="#6b7078" stroke-width="2.5"/>
  <path d="M118 149 L126 157" stroke="#6b7078" stroke-width="2.5" stroke-linecap="round"/>
  <text x="140" y="152" style="font-size:22px">터미널</text>
  <rect x="210" y="130" width="2" height="28" fill="#5e6ad2"/>
  <path d="M80 172 H688" stroke="#e4e4e8" stroke-width="1.5"/>
  <rect x="94" y="186" width="580" height="86" rx="10" fill="#e8eafb" stroke="#5e6ad2" stroke-width="2"/>
  <rect x="110" y="201" width="56" height="56" rx="12" fill="#1d1d21"/>
  <text x="138" y="236" text-anchor="middle" style="font-family:'SF Mono',Menlo,monospace;font-size:20px;font-weight:700;fill:#f7f8f8">&gt;_</text>
  <text class="l" x="184" y="223">터미널</text>
  <text class="s" x="184" y="251">Terminal</text>

  <!-- 3: Enter -->
  <circle cx="48" cy="336" r="14" fill="#5e6ad2"/><text class="n" x="48" y="342" text-anchor="middle">3</text>
  <rect x="80" y="315" width="140" height="50" rx="10" fill="#d9dbe0"/>
  <rect x="80" y="311" width="140" height="50" rx="10" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
  <text class="k" x="134" y="343" text-anchor="middle">return</text>
  <path d="M196 326 V340 H176 M182 334 L176 340 L182 346" fill="none" stroke="#1d1d21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M232 336 H268" stroke="#6b7078" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text class="l" x="282" y="343">창이 열려요</text>

  <text class="s" x="648" y="396" text-anchor="end">실제 화면은 조금 다를 수 있어요</text>
</svg>
