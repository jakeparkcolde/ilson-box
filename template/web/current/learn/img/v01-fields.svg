<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 448" width="720" height="448" role="img" aria-label="예약 요청 화면에서 받을 여섯 칸과 동의 체크 칸(이름·연락처·동의는 꼭, 나머지는 비워도 돼요), 받지 않을 주소·생일·주민등록번호·결제 정보를 나란히 놓은 비교 그림">
  <defs>
    <symbol id="field" viewBox="0 0 32 22">
      <rect x="0.75" y="0.75" width="30.5" height="20.5" rx="5" fill="#ffffff" stroke="#b8bcc2" stroke-width="1.5"/>
      <path d="M7 11 H19" stroke="#c9ccd1" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="nox" viewBox="0 0 16 16">
      <path d="M2 2 L14 14 M14 2 L2 14" stroke="#c4423b" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .h{font-size:22px;font-weight:600}
    .r{font-size:20px}
    .o{font-size:18px;fill:#6b7078}
    .chip{font-size:18px;font-weight:600;fill:#a3720a}
  </style>
  <rect width="720" height="448" rx="16" fill="#f5f6f6"/>

  <!-- what we collect -->
  <rect x="32" y="28" width="360" height="390" rx="16" fill="#ffffff" stroke="#1d8a38" stroke-width="2"/>
  <text class="h" x="56" y="66" style="fill:#1d8a38">받아요</text>
  <text x="56" y="96" style="font-size:18px">꼭 채울 칸: 이름 · 연락처 · 동의</text>
  <path d="M56 112 H368" stroke="#e4e4e8" stroke-width="1.5"/>

  <use href="#field" x="56" y="131" width="32" height="22"/>
  <text class="r" x="104" y="149">이름</text>
  <use href="#field" x="56" y="165" width="32" height="22"/>
  <text class="r" x="104" y="183">연락처 (전화나 이메일 하나)</text>
  <use href="#field" x="56" y="199" width="32" height="22"/>
  <text class="r" x="104" y="217">원하는 날짜 <tspan class="o">(비워도 돼요)</tspan></text>
  <use href="#field" x="56" y="233" width="32" height="22"/>
  <text class="r" x="104" y="251">원하는 시간 <tspan class="o">(비워도 돼요)</tspan></text>
  <use href="#field" x="56" y="267" width="32" height="22"/>
  <text class="r" x="104" y="285">원하는 상품 <tspan class="o">(비워도 돼요)</tspan></text>
  <use href="#field" x="56" y="301" width="32" height="22"/>
  <text class="r" x="104" y="319">남길 말 <tspan class="o">(비워도 돼요)</tspan></text>

  <rect x="62" y="340" width="20" height="20" rx="4" fill="#ffffff" stroke="#6b7078" stroke-width="2"/>
  <text class="r" x="104" y="357">동의: 개인정보 수집·이용 동의</text>
  <rect x="104" y="370" width="244" height="34" rx="8" fill="#f8efdc" stroke="#a3720a" stroke-width="1.5"/>
  <text class="chip" x="226" y="393" text-anchor="middle">[확인 필요] 안내 글은 심화 8강</text>

  <!-- what we never collect -->
  <rect x="424" y="28" width="264" height="216" rx="16" fill="#f8e3e1" stroke="#c4423b" stroke-width="1.5"/>
  <text class="h" x="448" y="66" style="fill:#c4423b">받지 않아요</text>
  <path d="M448 84 H664" stroke="#efc6c2" stroke-width="1.5"/>

  <use href="#nox" x="452" y="108" width="16" height="16"/>
  <text class="r" x="482" y="123">주소</text>
  <use href="#nox" x="452" y="142" width="16" height="16"/>
  <text class="r" x="482" y="157">생일</text>
  <use href="#nox" x="452" y="176" width="16" height="16"/>
  <text class="r" x="482" y="191">주민등록번호</text>
  <use href="#nox" x="452" y="210" width="16" height="16"/>
  <text class="r" x="482" y="225">결제 정보</text>
</svg>
