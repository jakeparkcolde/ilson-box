<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" width="720" height="404" role="img" aria-label="마감 저장 카드에 바뀐 파일 먼저 보기, 비밀값 확인, 한 줄 메시지로 저장, GitHub에 올리기 네 줄과 강제로 덮어 올리기는 하지 않는다는 빨간 줄이 있는 그림">
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .t{font-size:24px;font-weight:700}
    .r{font-size:22px}
    .en{font-size:18px;fill:#6b7078}
    .n{font-size:18px;font-weight:700;fill:#ffffff}
    .b{fill:#5e6ad2}
  </style>
  <rect width="720" height="404" rx="16" fill="#f5f6f6"/>

  <rect x="32" y="28" width="560" height="348" rx="16" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="t" x="58" y="72">마감 저장</text>
  <path d="M58 92 H566" stroke="#e4e4e8" stroke-width="1.5"/>

  <circle class="b" cx="72" cy="130" r="14"/><text class="n" x="72" y="136" text-anchor="middle">1</text>
  <text class="r" x="100" y="138">바뀐 파일 먼저 보기</text>

  <circle class="b" cx="72" cy="178" r="14"/><text class="n" x="72" y="184" text-anchor="middle">2</text>
  <text class="r" x="100" y="186">비밀값이 없는지 확인</text>

  <circle class="b" cx="72" cy="226" r="14"/><text class="n" x="72" y="232" text-anchor="middle">3</text>
  <text class="r" x="100" y="234">한국어 한 줄로 저장 <tspan class="en">(commit)</tspan></text>

  <circle class="b" cx="72" cy="274" r="14"/><text class="n" x="72" y="280" text-anchor="middle">4</text>
  <text class="r" x="100" y="282">GitHub에 올리기 <tspan class="en">(push)</tspan></text>

  <path d="M58 304 H566" stroke="#e4e4e8" stroke-width="1.5"/>

  <!-- never -->
  <rect x="48" y="316" width="528" height="44" rx="10" fill="#f8e3e1"/>
  <path d="M64 332 L76 344 M76 332 L64 344" stroke="#c4423b" stroke-width="2.4" stroke-linecap="round"/>
  <text x="90" y="345" style="font-size:20px;font-weight:600;fill:#c4423b">강제로 덮어 올리기 (force push)는 안 해요</text>
</svg>
