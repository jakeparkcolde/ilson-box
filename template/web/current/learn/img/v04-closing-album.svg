<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356" role="img" aria-label="작업 폴더의 모습을 날마다 한 장씩 남기는 마감 사진첩의 두 장이 있고, 그 사본을 올리기로 나만 보는 GitHub 비공개 보관함에 보내는 그림">
  <defs>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#5e6ad2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e6e8eb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <symbol id="doc" viewBox="0 0 12 15">
      <path d="M1 1 H8 L11 4 V14 H1 Z" fill="#ffffff" stroke="#6b7078" stroke-width="1.4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="fold" viewBox="0 0 26 19">
      <path d="M1 3 Q1 1 3 1 H9 L11.5 3.5 H23 Q25 3.5 25 5.5 V16 Q25 18 23 18 H3 Q1 18 1 16 Z" fill="#ffffff" stroke="#6b7078" stroke-width="1.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="corners" viewBox="0 0 176 116">
      <path d="M0 13 V0 H13 Z M163 0 H176 V13 Z M176 103 V116 H163 Z M13 116 H0 V103 Z" fill="#c9ccd1"/>
    </symbol>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .t{font-size:22px;font-weight:600}
    .l{font-size:20px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .mi{font-family:'SF Mono',Menlo,monospace;font-size:18px;fill:#1d1d21}
    .photo{fill:#f5f6f6;stroke:#e4e4e8;stroke-width:1.5}
  </style>
  <rect width="720" height="356" rx="16" fill="#f5f6f6"/>

  <text class="t" x="32" y="44">마감 사진첩 (git)</text>

  <!-- open album -->
  <rect x="24" y="58" width="408" height="244" rx="14" fill="#e1e4e8"/>
  <path d="M42 64 H228 V296 H42 Q32 296 32 286 V74 Q32 64 42 64 Z" fill="#ffffff"/>
  <path d="M228 64 H414 Q424 64 424 74 V286 Q424 296 414 296 H228 Z" fill="#ffffff"/>
  <rect x="214" y="64" width="28" height="232" fill="url(#spine)"/>
  <path d="M228 64 V296" stroke="#c9ccd1" stroke-width="1.5"/>

  <!-- page 1 -->
  <rect class="photo" x="42" y="80" width="176" height="116" rx="4"/>
  <use href="#corners" x="42" y="80" width="176" height="116"/>
  <use href="#fold" x="58" y="108" width="26" height="19"/>
  <text class="mi" x="94" y="124">public/</text>
  <use href="#doc" x="65" y="148" width="12" height="15"/>
  <text class="mi" x="94" y="162">CLAUDE.md</text>
  <text class="l" x="130" y="232" text-anchor="middle">첫 마감</text>
  <text class="s" x="130" y="262" text-anchor="middle">1장 (commit)</text>

  <!-- page 2 -->
  <rect class="photo" x="238" y="80" width="176" height="116" rx="4"/>
  <use href="#corners" x="238" y="80" width="176" height="116"/>
  <use href="#fold" x="254" y="108" width="26" height="19"/>
  <text class="mi" x="290" y="124">public/</text>
  <use href="#doc" x="261" y="148" width="12" height="15"/>
  <text class="mi" x="290" y="162">CLAUDE.md</text>
  <circle cx="400" cy="156" r="5" fill="#5e6ad2"/>
  <text class="l" x="326" y="232" text-anchor="middle">마감 저장 순서 더함</text>
  <text class="s" x="326" y="262" text-anchor="middle">2장 (commit)</text>

  <text class="s" x="32" y="332">이 Mac</text>

  <!-- push the copy -->
  <path d="M436 100 H584 V118" stroke="#5e6ad2" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrowP)"/>
  <text x="510" y="88" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#5e6ad2">올리기 (push)</text>

  <rect x="480" y="126" width="208" height="148" rx="14" fill="#ffffff" stroke="#1d8a38" stroke-width="2"/>
  <rect x="497" y="152" width="20" height="15" rx="3" fill="#e6f3e9" stroke="#1d8a38" stroke-width="2"/>
  <path d="M501 152 V146 a6 6 0 0 1 12 0 V152" fill="none" stroke="#1d8a38" stroke-width="2"/>
  <text class="l" x="496" y="200">GitHub 비공개 보관함</text>
  <text class="mi" x="496" y="230">haetsal-booking</text>
  <text class="s" x="496" y="258">나와 초대한 사람만</text>
</svg>
