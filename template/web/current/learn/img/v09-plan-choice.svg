<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 448" width="720" height="448" role="img" aria-label="실제 가게를 알리는 페이지인지 묻고, 지어낸 가게 이름으로 연습하면 Hobby 0달러, 실제 가게 이름이 들어가면 Pro 월 20달러와 부가세 별도로 가는 판단 그림">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7078" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .q{font-size:22px;font-weight:600}
    .r{font-size:20px}
    .y{font-size:20px;font-weight:600;fill:#6b7078}
    .pl{font-size:24px;font-weight:600}
    .pr{font-size:22px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .ok{fill:#1d8a38}
    .a{stroke:#6b7078;stroke-width:2;fill:none;stroke-linejoin:round}
  </style>
  <rect width="720" height="448" rx="16" fill="#f5f6f6"/>

  <!-- question with hint -->
  <rect x="180" y="24" width="360" height="78" rx="22" fill="#e8eafb" stroke="#5e6ad2" stroke-width="1.5"/>
  <text class="q" x="360" y="58" text-anchor="middle">실제 가게를 알리는 페이지인가요?</text>
  <text class="s" x="360" y="86" text-anchor="middle">실제 가게 이름이 들어가면 「예」</text>

  <path class="a" d="M300 102 V136 H184 V158" marker-end="url(#arrow)"/>
  <path class="a" d="M420 102 V136 H536 V158" marker-end="url(#arrow)"/>
  <text class="y" x="242" y="127" text-anchor="middle">아니요</text>
  <text class="y" x="478" y="127" text-anchor="middle">예</text>

  <!-- no: practice with a made-up name -->
  <rect x="32" y="164" width="304" height="192" rx="14" fill="#ffffff" stroke="#1d8a38" stroke-width="2"/>
  <text class="r" x="56" y="204">지어낸 가게 이름으로 연습</text>
  <text class="pl" x="56" y="248">Hobby<tspan class="pr ok" dx="14">$0</tspan></text>
  <text class="s" x="56" y="282">개인·비상업용</text>

  <!-- yes: real shop -->
  <rect x="384" y="164" width="304" height="192" rx="14" fill="#f8efdc" stroke="#a3720a" stroke-width="1.5"/>
  <text class="r" x="408" y="204">내 가게 예약 페이지</text>
  <text class="pl" x="408" y="248">Pro<tspan class="pr" dx="14">월 $20 (부가세 별도)</tspan></text>
  <text class="s" x="408" y="282">14일 무료 체험</text>
  <text class="s" x="408" y="310">판매 광고 = 상업적 사용</text>
  <text class="s" x="408" y="338">2026-10-21 기준</text>

  <!-- never -->
  <rect x="32" y="380" width="400" height="44" rx="10" fill="#f8e3e1"/>
  <path d="M50 396 L62 408 M62 396 L50 408" stroke="#c4423b" stroke-width="2.4" stroke-linecap="round"/>
  <text x="78" y="409" style="font-size:20px;font-weight:600;fill:#c4423b">실제 가게를 Hobby로 올리지 않아요</text>
</svg>
