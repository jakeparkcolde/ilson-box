<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Supabase 프로젝트 화면 왼쪽 메뉴에서 SQL Editor를 열고, 가운데 칸에 SQL을 붙여 넣은 뒤 실행 버튼을 누르는 순서를 번호로 보여 주는 화면 스케치">
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .l{font-size:20px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .m{font-family:'SF Mono',Menlo,monospace;font-size:18px}
    .n{font-size:18px;font-weight:700;fill:#ffffff}
    .bar{fill:#e4e4e8}
  </style>
  <rect width="720" height="420" rx="16" fill="#f5f6f6"/>

  <!-- dashboard window (schematic) -->
  <rect x="32" y="24" width="656" height="332" rx="12" fill="#ffffff"/>
  <path d="M32 60 V36 Q32 24 44 24 H676 Q688 24 688 36 V60 Z" fill="#eceef0"/>
  <circle cx="52" cy="42" r="5" fill="#c9ccd1"/><circle cx="68" cy="42" r="5" fill="#c9ccd1"/><circle cx="84" cy="42" r="5" fill="#c9ccd1"/>
  <!-- left menu -->
  <path d="M32 60 H212 V356 H44 Q32 356 32 344 Z" fill="#f8f9fa"/>
  <path d="M212 60 V356" stroke="#e4e4e8" stroke-width="1.5"/>
  <rect x="32" y="24" width="656" height="332" rx="12" fill="none" stroke="#e4e4e8" stroke-width="1.5"/>

  <rect class="bar" x="56" y="84" width="104" height="12" rx="6"/>
  <text x="60" y="138" style="font-size:20px">Table Editor</text>
  <rect x="44" y="160" width="156" height="42" rx="9" fill="#e8eafb" stroke="#5e6ad2" stroke-width="2"/>
  <text class="l" x="60" y="188">SQL Editor</text>
  <circle cx="180" cy="181" r="14" fill="#5e6ad2"/><text class="n" x="180" y="187" text-anchor="middle">1</text>
  <rect class="bar" x="56" y="228" width="120" height="12" rx="6"/>
  <rect class="bar" x="56" y="256" width="88" height="12" rx="6"/>

  <!-- toolbar with run button -->
  <rect class="bar" x="232" y="88" width="132" height="12" rx="6"/>
  <circle cx="560" cy="94" r="14" fill="#5e6ad2"/><text class="n" x="560" y="100" text-anchor="middle">3</text>
  <rect x="584" y="76" width="84" height="36" rx="18" fill="#5e6ad2"/>
  <text x="626" y="101" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#ffffff">실행</text>

  <!-- editor area -->
  <rect x="232" y="124" width="436" height="152" rx="10" fill="#ffffff" stroke="#5e6ad2" stroke-width="2"/>
  <circle cx="644" cy="148" r="14" fill="#5e6ad2"/><text class="n" x="644" y="154" text-anchor="middle">2</text>
  <text class="m" x="248" y="160" style="fill:#6b7078">-- schema.sql : 예약·문의 상자 만들기</text>
  <text class="m" x="248" y="190">create table public.reservation_…</text>
  <rect class="bar" x="248" y="206" width="300" height="10" rx="5"/>
  <rect class="bar" x="248" y="228" width="352" height="10" rx="5"/>
  <rect class="bar" x="248" y="250" width="248" height="10" rx="5"/>

  <!-- result -->
  <rect x="232" y="290" width="436" height="48" rx="10" fill="#e6f3e9" stroke="#1d8a38" stroke-width="1.5"/>
  <path d="M252 314 L259 321 L272 307" fill="none" stroke="#1d8a38" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="284" y="321" style="font-size:20px;font-weight:600;fill:#1d8a38">결과: 오류 없이 끝났어요</text>

  <text class="s" x="32" y="392">실제 화면은 조금 다를 수 있어요</text>
</svg>
