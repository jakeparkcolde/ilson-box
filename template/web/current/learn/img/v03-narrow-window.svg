<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="좁게 줄인 브라우저 창에 예약 요청 칸들이 세로로 쌓이고, 비워도 되는 칸 표시와 동의 칸 옆 확인 필요 표시, 큰 예약 요청 보내기 버튼과 아직 연습 중이라는 안내가 보이는 화면 스케치">
  <defs>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#5e6ad2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .h{font-size:22px;font-weight:600}
    .f{font-size:18px}
    .o{fill:#6b7078}
    .s{font-size:18px;fill:#6b7078}
    .l{font-size:20px;font-weight:600}
    .n{font-size:18px;font-weight:700;fill:#ffffff}
    .in{fill:#eceef0;stroke:#c9ccd1;stroke-width:1.2}
  </style>
  <rect width="720" height="480" rx="16" fill="#f5f6f6"/>

  <!-- narrowed browser window -->
  <rect x="86" y="10" width="340" height="440" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <path d="M86 40 V24 Q86 10 100 10 H412 Q426 10 426 24 V40 Z" fill="#eceef0"/>
  <circle cx="106" cy="25" r="5" fill="#c9ccd1"/><circle cx="124" cy="25" r="5" fill="#c9ccd1"/><circle cx="142" cy="25" r="5" fill="#c9ccd1"/>
  <rect x="162" y="17" width="244" height="16" rx="8" fill="#ffffff"/>

  <text class="h" x="106" y="70">예약 요청</text>

  <text class="f" x="106" y="98">이름</text>
  <rect class="in" x="106" y="103" width="300" height="12" rx="5"/>
  <text class="f" x="106" y="138">연락처</text>
  <rect class="in" x="106" y="143" width="300" height="12" rx="5"/>
  <text class="f" x="106" y="178">원하는 날짜 <tspan class="o">(비워도 돼요)</tspan></text>
  <rect class="in" x="106" y="183" width="300" height="12" rx="5"/>
  <text class="f" x="106" y="218">원하는 시간 <tspan class="o">(비워도 돼요)</tspan></text>
  <rect class="in" x="106" y="223" width="300" height="12" rx="5"/>
  <text class="f" x="106" y="268">원하는 상품 <tspan class="o">(비워도 돼요)</tspan></text>
  <rect class="in" x="308" y="256" width="98" height="12" rx="5"/>
  <text class="f" x="106" y="298">남길 말 <tspan class="o">(비워도 돼요)</tspan></text>
  <rect class="in" x="308" y="286" width="98" height="12" rx="5"/>

  <rect x="107" y="316" width="18" height="18" rx="4" fill="#ffffff" stroke="#6b7078" stroke-width="1.8"/>
  <text class="f" x="134" y="331">개인정보 수집·이용에</text>
  <text class="f" x="134" y="357">동의합니다</text>
  <rect x="220" y="338" width="92" height="28" rx="8" fill="#f8efdc" stroke="#a3720a" stroke-width="1.5"/>
  <text x="266" y="358" text-anchor="middle" style="font-size:18px;font-weight:600;fill:#a3720a">[확인 필요]</text>

  <rect x="106" y="372" width="300" height="42" rx="10" fill="#5e6ad2"/>
  <text x="256" y="400" text-anchor="middle" style="font-size:20px;font-weight:600;fill:#ffffff">예약 요청 보내기</text>
  <circle cx="62" cy="393" r="14" fill="#5e6ad2"/><text class="n" x="62" y="399" text-anchor="middle">2</text>

  <text x="106" y="437" style="font-size:20px;font-weight:600;fill:#1d8a38">아직 연습 중이에요.</text>

  <!-- drag the edge to narrow the window -->
  <rect x="421" y="112" width="10" height="36" rx="5" fill="#5e6ad2"/>
  <path d="M646 106 V154" stroke="#a7b0ff" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M640 130 H440" stroke="#5e6ad2" stroke-width="2.5" fill="none" marker-end="url(#arrowP)"/>
  <circle cx="454" cy="86" r="14" fill="#5e6ad2"/><text class="n" x="454" y="92" text-anchor="middle">1</text>
  <text class="l" x="474" y="93">창 가장자리를 끌어 좁혀요</text>

  <text class="s" x="32" y="473">실제 화면은 조금 다를 수 있어요</text>
</svg>
