<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="720" height="436" role="img" aria-label="claude.ai와 데스크톱 앱, 일손박스 터미널, 일손박스 메뉴, 예약 업무가 한 계정의 사용량 한도를 함께 쓰고, 5시간 세션 한도와 유료 요금제의 주간 한도가 따로 있는 그림">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7078" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .t{font-size:26px;font-weight:700}
    .h{font-size:22px;font-weight:700}
    .l{font-size:20px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .m{font-family:'SF Mono',Menlo,monospace;font-size:18px}
  </style>
  <rect width="720" height="436" rx="16" fill="#f5f6f6"/>

  <text class="t" x="32" y="54">어디서 쓰든 한도는 하나</text>

  <!-- source cards -->
  <g fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5">
    <rect x="32" y="84" width="280" height="60" rx="12"/>
    <rect x="32" y="160" width="280" height="60" rx="12"/>
    <rect x="32" y="236" width="280" height="60" rx="12"/>
    <rect x="32" y="312" width="280" height="60" rx="12"/>
  </g>

  <!-- icon: browser / app window -->
  <rect x="49" y="101" width="32" height="26" rx="4" fill="#ffffff" stroke="#6b7078" stroke-width="2"/>
  <path d="M49 109 H 81" stroke="#6b7078" stroke-width="2"/>
  <g fill="#6b7078"><circle cx="54" cy="105" r="1.6"/><circle cx="59" cy="105" r="1.6"/><circle cx="64" cy="105" r="1.6"/></g>
  <rect x="54" y="114" width="18" height="4" rx="2" fill="#e4e4e8"/>
  <rect x="54" y="120" width="11" height="3" rx="1.5" fill="#e4e4e8"/>
  <text class="l" x="96" y="121">claude.ai · 데스크톱 앱</text>

  <!-- icon: terminal -->
  <rect x="49" y="178" width="32" height="24" rx="5" fill="#1d1d21"/>
  <path d="M55 185 L 60 190 L 55 195" fill="none" stroke="#a7b0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M63 196 H 73" stroke="#a7b0ff" stroke-width="2" stroke-linecap="round"/>
  <text class="l" x="96" y="197">터미널</text>
  <text class="m" x="159" y="197">ilson chat</text>

  <!-- icon: menu tiles -->
  <g fill="#ffffff" stroke="#6b7078" stroke-width="2">
    <rect x="50" y="254" width="12" height="10" rx="3"/>
    <rect x="68" y="254" width="12" height="10" rx="3"/>
    <rect x="50" y="268" width="12" height="10" rx="3"/>
    <rect x="68" y="268" width="12" height="10" rx="3"/>
  </g>
  <text class="l" x="96" y="273">일손박스 메뉴 (리서치 등)</text>

  <!-- icon: clock -->
  <circle cx="65" cy="342" r="12" fill="#ffffff" stroke="#6b7078" stroke-width="2"/>
  <path d="M65 335 V 342 L 70 346" fill="none" stroke="#6b7078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="l" x="96" y="349">예약 업무 (아침 보고 등)</text>

  <!-- connectors joining into one arrow -->
  <g fill="none" stroke="#6b7078" stroke-width="2" stroke-linecap="round">
    <path d="M312 114 H 322 Q 332 114 332 124 V 332 Q 332 342 322 342 H 312"/>
    <path d="M312 190 H 332"/>
    <path d="M312 266 H 332"/>
    <path d="M332 228 H 360" marker-end="url(#arrow)"/>
  </g>

  <!-- the one shared allowance -->
  <rect x="368" y="84" width="320" height="288" rx="14" fill="#e8eafb" stroke="#5e6ad2" stroke-width="1.5"/>
  <text class="h" x="392" y="124">내 Claude 계정 한도</text>

  <text class="l" x="392" y="170">현재 세션</text>
  <rect x="392" y="184" width="272" height="16" rx="8" fill="#ffffff"/>
  <rect x="392" y="184" width="128" height="16" rx="8" fill="#5e6ad2"/>
  <text class="s" x="392" y="228">5시간마다 다시 채워져요</text>

  <path d="M392 250 H 664" stroke="#5e6ad2" stroke-opacity="0.3" stroke-width="1.5"/>

  <text class="l" x="392" y="290">주간 한도</text>
  <rect x="392" y="304" width="272" height="16" rx="8" fill="#ffffff"/>
  <rect x="392" y="304" width="88" height="16" rx="8" fill="#5e6ad2"/>
  <text class="s" x="392" y="348">유료 요금제에만 있어요</text>
</svg>
