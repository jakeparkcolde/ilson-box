<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" role="img" aria-label="지금은 이 Mac 안의 파일이라 나만 보고, 나중에 바이브 코딩 심화에서 인터넷 주소를 얻으면 누구나 볼 수 있으니 넣지 않을 정보를 먼저 걸러야 한다는 비교 그림">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7078" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="nx" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="#c4423b"/><path d="M6 6 L14 14 M14 6 L6 14" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/></symbol>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .hb{font-size:22px;font-weight:700}
    .l{font-size:20px;font-weight:600}
    .r{font-size:20px}
    .r8{font-size:18px}
    .mu{fill:#6b7078}
    .mono{font-family:'SF Mono',Menlo,monospace}
    .ln{fill:none;stroke:#6b7078;stroke-width:2}
  </style>
  <rect width="720" height="372" rx="16" fill="#f5f6f6"/>
  <g transform="translate(0 -8)">

  <!-- now: a file on this Mac -->
  <rect x="32" y="40" width="188" height="262" rx="14" fill="#e8eafb" stroke="#5e6ad2" stroke-width="1.5"/>
  <text class="hb" x="126" y="78" text-anchor="middle" style="fill:#5e6ad2">지금</text>
  <rect x="96" y="96" width="60" height="42" rx="6" fill="#ffffff" stroke="#5e6ad2" stroke-width="2"/>
  <path d="M120 104 H130 L135 109 V128 H120 Z" fill="none" stroke="#5e6ad2" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M118 138 L115 148 H137 L134 138" fill="none" stroke="#5e6ad2" stroke-width="2" stroke-linejoin="round"/>
  <path d="M108 149 H144" stroke="#5e6ad2" stroke-width="2" stroke-linecap="round"/>
  <text class="l" x="126" y="182" text-anchor="middle">이 Mac 안의 파일</text>
  <text class="r" x="126" y="214" text-anchor="middle">나만 봐요</text>
  <text class="r8" x="126" y="250" text-anchor="middle"><tspan class="mono">file://</tspan> 주소</text>

  <path class="ln" d="M224 171 H248" marker-end="url(#arrow)"/>

  <!-- filter before publishing -->
  <rect x="256" y="40" width="208" height="262" rx="14" fill="#f8efdc" stroke="#a3720a" stroke-width="1.5"/>
  <text class="l" x="360" y="78" text-anchor="middle">올리기 전에 걸러요</text>
  <path d="M276 96 H444" stroke="#e6d3ad" stroke-width="1.5"/>
  <use href="#nx" x="276" y="134" width="20" height="20"/>
  <text class="r" x="306" y="151">개인 휴대폰 번호</text>
  <use href="#nx" x="276" y="186" width="20" height="20"/>
  <text class="r" x="306" y="203">손님 이름</text>
  <use href="#nx" x="276" y="238" width="20" height="20"/>
  <text class="r" x="306" y="255">[확인 필요] 칸</text>

  <path class="ln" d="M468 171 H492" marker-end="url(#arrow)"/>

  <!-- later: public address (taught in the advanced track) -->
  <rect x="500" y="40" width="188" height="262" rx="14" fill="#ffffff" stroke="#6b7078" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="hb mu" x="594" y="78" text-anchor="middle">나중에</text>
  <circle cx="594" cy="120" r="22" fill="none" stroke="#9aa0a8" stroke-width="2"/>
  <ellipse cx="594" cy="120" rx="10" ry="22" fill="none" stroke="#9aa0a8" stroke-width="2"/>
  <path d="M572 120 H616 M576 109 H612 M576 131 H612" stroke="#9aa0a8" stroke-width="2"/>
  <text class="l mu" x="594" y="182" text-anchor="middle">인터넷 주소</text>
  <text class="r mu" x="594" y="214" text-anchor="middle">누구나 볼 수 있어요</text>
  <text class="r8 mu" x="594" y="248" text-anchor="middle">바이브 코딩 심화</text>
  </g>
</svg>
