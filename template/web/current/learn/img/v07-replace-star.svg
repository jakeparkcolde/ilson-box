<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="★ 줄에서 작은따옴표 안의 여기에-사장님-아이디만 복사한 사장님 아이디로 바꾸고, 작은따옴표와 ::uuid는 그대로 두는 것을 보여 주는 전후 비교 그림">
  <defs>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#5e6ad2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .l{font-size:20px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .m{font-family:'SF Mono',Menlo,monospace;font-size:18px}
    .c{font-family:'SF Mono',Menlo,monospace;font-size:18px;fill:#6b7078}
    .card{fill:#ffffff;stroke:#e4e4e8;stroke-width:1.5}
  </style>
  <rect width="720" height="440" rx="16" fill="#f5f6f6"/>

  <!-- before -->
  <text class="l" x="32" y="44">바꾸기 전</text>
  <rect class="card" x="32" y="60" width="560" height="88" rx="12"/>
  <text class="m" x="52" y="96">using ( (select auth.uid()) =</text>
  <rect x="84" y="111" width="166" height="26" rx="5" fill="#f8efdc" stroke="#a3720a" stroke-width="1.2"/>
  <text class="m" x="74.3" y="130">'</text>
  <text class="m" x="85.4" y="130">여기에-사장님-아이디</text>
  <text class="m" x="250" y="130">'::uuid );</text>
  <text class="c" x="394" y="130">-- <tspan style="fill:#a3720a">★</tspan> 바꿀 곳 1</text>

  <!-- change only inside the quotes -->
  <path d="M166 154 V240" stroke="#5e6ad2" stroke-width="2.5" fill="none" marker-end="url(#arrowP)"/>
  <text class="l" x="184" y="204" style="fill:#5e6ad2">따옴표 안만 바꿔요</text>

  <!-- after -->
  <text class="l" x="32" y="236">바꾼 뒤</text>
  <rect class="card" x="32" y="248" width="560" height="88" rx="12"/>
  <text class="m" x="52" y="284">using ( (select auth.uid()) =</text>
  <rect x="94" y="299" width="120" height="26" rx="5" fill="#e6f3e9" stroke="#1d8a38" stroke-width="1.2"/>
  <text class="m" x="74.3" y="318">'</text>
  <text x="154" y="318" text-anchor="middle" style="font-size:18px;font-weight:600">(복사한 아이디)</text>
  <text class="m" x="219.5" y="318">'::uuid );</text>
  <text class="c" x="364" y="318">-- <tspan style="fill:#a3720a">★</tspan> 바꿀 곳 1</text>
  <!-- keep: quotes and ::uuid -->
  <rect x="70" y="297" width="19.5" height="30" rx="4" fill="none" stroke="#6b7078" stroke-width="1.3" stroke-dasharray="3 3"/>
  <rect x="216.5" y="297" width="84" height="30" rx="4" fill="none" stroke="#6b7078" stroke-width="1.3" stroke-dasharray="3 3"/>
  <path d="M79.7 327 V354" stroke="#6b7078" stroke-width="1.5"/>
  <path d="M258.5 327 V354" stroke="#6b7078" stroke-width="1.5"/>
  <text class="s" x="80" y="376" text-anchor="middle">그대로</text>
  <text class="s" x="258.5" y="376" text-anchor="middle">그대로</text>

  <text class="l" x="32" y="416" style="fill:#5e6ad2">★ 바꿀 곳 2도 똑같이</text>
</svg>
