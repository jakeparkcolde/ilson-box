<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" width="720" height="424" role="img" aria-label="인터뷰 전에는 회사 정보가 확인 필요이고 가게 이름이 예시인데, 인터뷰 뒤 다시 확인을 누르면 됐어요와 회사 이름으로 바뀌는 전후 비교 그림">
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#5e6ad2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .col{font-size:20px;font-weight:600;fill:#6b7078}
    .l{font-size:20px;font-weight:600}
    .st{font-size:18px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .v{font-size:22px;font-weight:700}
    .hl{stroke:#e4e4e8;stroke-width:1.5}
  </style>
  <rect width="720" height="424" rx="16" fill="#f5f6f6"/>

  <text class="col" x="170" y="52" text-anchor="middle">인터뷰 전</text>
  <text class="col" x="550" y="52" text-anchor="middle">인터뷰 후</text>

  <!-- before -->
  <g transform="translate(32 68)">
    <rect width="276" height="276" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
    <path d="M18 30 H24 L29 18 L36 42 L41 30 H48" fill="none" stroke="#6b7078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="l" x="58" y="36">내 일손박스 지금 상태</text>
    <path d="M1 52 H275" class="hl"/>
    <rect x="18" y="66" width="128" height="34" rx="17" fill="#f8efdc"/>
    <circle cx="40" cy="83" r="8" fill="none" stroke="#a3720a" stroke-width="2"/>
    <path d="M40 78.5 V84" stroke="#a3720a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="40" cy="87.5" r="1.3" fill="#a3720a"/>
    <text class="st" x="56" y="89" style="fill:#a3720a">확인 필요</text>
    <text class="l" x="162" y="90">회사 정보</text>
    <text class="s" x="18" y="126">회사 정보가 비어 있습니다.</text>
    <path d="M18 144 H258" class="hl"/>
    <text class="s" x="18" y="172">부탁 문장에 들어가는 가게</text>
    <text class="v" x="18" y="204">햇살꽃집</text>
    <text class="s" x="18" y="234">지금은 예시예요</text>
  </g>

  <!-- the button and the change -->
  <rect x="314" y="176" width="92" height="34" rx="10" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
  <text class="st" x="360" y="199" text-anchor="middle">다시 확인</text>
  <path d="M318 234 H400" stroke="#5e6ad2" stroke-width="2.5" fill="none" marker-end="url(#arrowA)"/>

  <!-- after -->
  <g transform="translate(412 68)">
    <rect width="276" height="276" rx="14" fill="#ffffff" stroke="#1d8a38" stroke-width="2"/>
    <path d="M18 30 H24 L29 18 L36 42 L41 30 H48" fill="none" stroke="#6b7078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="l" x="58" y="36">내 일손박스 지금 상태</text>
    <path d="M1 52 H275" class="hl"/>
    <rect x="18" y="66" width="128" height="34" rx="17" fill="#e6f3e9"/>
    <circle cx="40" cy="83" r="8" fill="none" stroke="#1d8a38" stroke-width="2"/>
    <path d="M36 83 L39 86 L44 80" fill="none" stroke="#1d8a38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="st" x="56" y="89" style="fill:#1d8a38">됐어요</text>
    <text class="l" x="162" y="90">회사 정보</text>
    <text class="s" x="18" y="126">회사 이름이 기록되어 있습니다.</text>
    <path d="M18 144 H258" class="hl"/>
    <text class="s" x="18" y="172">부탁 문장에 들어가는 가게</text>
    <text class="v" x="18" y="204">우리 회사 이름</text>
    <text class="s" x="18" y="234">가게 이름은 회사 정보에서</text>
    <text class="s" x="18" y="258">가져왔어요.</text>
  </g>

  <!-- side note (explains the rule; not a screen string) -->
  <path d="M432 346 V402" stroke="#6b7078" stroke-width="1.5"/>
  <text class="s" x="446" y="374">직접 적은 가게 이름이 있으면</text>
  <text class="s" x="446" y="398">그 이름이 먼저</text>
</svg>
