<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="Vercel 새 프로젝트 화면에서 haetsal-booking 저장소를 가져오고, Application Preset이 Other인지 본 뒤, Output Directory의 Override를 켜고 public을 적어 Deploy를 누르는 순서를 번호로 보여 주는 화면 스케치">
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .h{font-size:22px;font-weight:600}
    .l{font-size:20px;font-weight:600}
    .r{font-size:20px}
    .c{font-size:18px}
    .sh{font-size:18px;font-weight:600;fill:#6b7078}
    .s{font-size:18px;fill:#6b7078}
    .m{font-family:'SF Mono',Menlo,monospace;font-size:18px;fill:#1d1d21}
    .n{font-size:18px;font-weight:700;fill:#ffffff}
    .bt{font-size:18px;font-weight:600;fill:#ffffff}
    .btn{font-size:20px;font-weight:600;fill:#ffffff}
    .win{fill:#ffffff;stroke:#e4e4e8;stroke-width:1.5}
    .pan{fill:#ffffff;stroke:#e4e4e8;stroke-width:1.5}
    .sep{stroke:#eceef0;stroke-width:1.5}
    .bar{fill:#e4e4e8}
    .b{fill:#5e6ad2}
  </style>
  <rect width="720" height="470" rx="16" fill="#f5f6f6"/>

  <!-- window -->
  <rect class="win" x="24" y="24" width="672" height="366" rx="12"/>
  <path d="M24 58 V36 Q24 24 36 24 H684 Q696 24 696 36 V58 Z" fill="#eceef0"/>
  <circle cx="44" cy="41" r="5" fill="#c9ccd1"/><circle cx="62" cy="41" r="5" fill="#c9ccd1"/><circle cx="80" cy="41" r="5" fill="#c9ccd1"/>
  <text class="h" x="48" y="92">New Project</text>

  <!-- Import Git Repository -->
  <rect class="pan" x="44" y="108" width="308" height="266" rx="10"/>
  <text class="l" x="64" y="140">Import Git Repository</text>
  <rect class="bar" x="96" y="166" width="150" height="14" rx="7"/>
  <path class="sep" d="M60 192 H336"/>
  <rect x="86" y="198" width="260" height="44" rx="8" fill="#e8eafb"/>
  <text class="m" x="94" y="226">haetsal-booking</text>
  <rect x="270" y="205" width="70" height="30" rx="8" fill="#5e6ad2"/>
  <text class="bt" x="305" y="226" text-anchor="middle">Import</text>
  <circle class="b" cx="66" cy="220" r="14"/><text class="n" x="66" y="226" text-anchor="middle">1</text>
  <path class="sep" d="M60 248 H336"/>
  <rect class="bar" x="96" y="266" width="130" height="14" rx="7"/>
  <path class="sep" d="M60 298 H336"/>
  <rect class="bar" x="96" y="316" width="160" height="14" rx="7"/>

  <!-- configure -->
  <rect class="pan" x="372" y="108" width="304" height="266" rx="10"/>
  <text class="l" x="416" y="140">Application Preset</text>
  <rect x="416" y="152" width="244" height="36" rx="8" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
  <text class="r" x="432" y="177">Other</text>
  <path d="M634 167 L640 173 L646 167" fill="none" stroke="#1d1d21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="b" cx="394" cy="170" r="14"/><text class="n" x="394" y="176" text-anchor="middle">2</text>

  <path class="sep" d="M388 202 H660"/>
  <text class="sh" x="416" y="228">Build and Output Settings</text>
  <path d="M622 219 L627 224 L632 219" fill="none" stroke="#6b7078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="l" x="416" y="260">Output Directory</text>
  <circle class="b" cx="394" cy="253" r="14"/><text class="n" x="394" y="259" text-anchor="middle">3</text>
  <rect x="416" y="272" width="244" height="36" rx="8" fill="#ffffff" stroke="#5e6ad2" stroke-width="2"/>
  <text class="m" x="430" y="296">public</text>
  <path d="M530 277 V303" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="c" x="540" y="296">Override</text>
  <rect x="614" y="280" width="36" height="20" rx="10" fill="#5e6ad2"/>
  <circle cx="640" cy="290" r="7.5" fill="#ffffff"/>

  <rect x="416" y="324" width="244" height="36" rx="10" fill="#5e6ad2"/>
  <text class="btn" x="538" y="349" text-anchor="middle">Deploy</text>
  <circle class="b" cx="394" cy="342" r="14"/><text class="n" x="394" y="348" text-anchor="middle">4</text>

  <text class="s" x="24" y="430">실제 화면은 조금 다를 수 있어요</text>
</svg>
