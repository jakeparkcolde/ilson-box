<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" width="720" height="388" role="img" aria-label="가시 칸 없이 부탁해 하지 않은 환불 약속이 섞인 답장과, 가시 칸을 채워 약속 없이 정중한 답장을 나란히 비교한 그림">
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .l{font-size:21px;font-weight:600}
    .b{font-size:20px}
    .s{font-size:18px;fill:#6b7078}
  </style>
  <rect width="720" height="388" rx="16" fill="#f5f6f6"/>

  <!-- left: without the 가시 box -->
  <rect x="32" y="24" width="316" height="340" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="l" x="190" y="66" text-anchor="middle">가시 칸 없이</text>
  <path d="M68 86 H312 A16 16 0 0 1 328 102 V240 A16 16 0 0 1 312 256 H98 L76 272 L80 256 H68 A16 16 0 0 1 52 240 V102 A16 16 0 0 1 68 86 Z" fill="#f5f6f6" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="s" x="72" y="120">예시 답장</text>
  <text class="b" x="72" y="158">불편을 드려 죄송해요.</text>
  <rect x="64" y="172" width="190" height="32" rx="6" fill="#f8e3e1"/>
  <text class="b" x="72" y="195">전액 환불해 드릴게요.</text>
  <path d="M72 204 H244" stroke="#c4423b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="127" cy="312" r="16" fill="#c4423b"/>
  <path d="M121 306 L133 318 M133 306 L121 318" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text class="l" x="153" y="319" style="fill:#c4423b">하지 않은 약속</text>

  <!-- right: with the 가시 box filled -->
  <rect x="372" y="24" width="316" height="340" rx="14" fill="#ffffff" stroke="#1d8a38" stroke-width="2"/>
  <text class="l" x="530" y="66" text-anchor="middle">가시 칸을 채우면</text>
  <path d="M408 86 H652 A16 16 0 0 1 668 102 V240 A16 16 0 0 1 652 256 H438 L416 272 L420 256 H408 A16 16 0 0 1 392 240 V102 A16 16 0 0 1 408 86 Z" fill="#f5f6f6" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="s" x="412" y="120">예시 답장</text>
  <text class="b" x="412" y="158">불편을 드려 죄송해요.</text>
  <text class="b" x="412" y="195">어떤 점이 달랐는지</text>
  <text class="b" x="412" y="230">여쭤봐도 될까요?</text>
  <circle cx="450" cy="312" r="16" fill="#1d8a38"/>
  <path d="M442 312 L448 318 L459 306" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="l" x="476" y="319" style="fill:#1d8a38">약속 없이 정중하게</text>
</svg>
