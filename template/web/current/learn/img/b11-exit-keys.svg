<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 444" width="720" height="444" role="img" aria-label="나가기 /exit, control+C 두 번, 멈추기 esc, 다시 열기 ilson chat과 /resume을 정리한 카드">
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .h{font-size:24px;font-weight:700}
    .l{font-size:20px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .k{font-size:18px;font-weight:600}
    .c{font-family:'SF Mono',Menlo,monospace;font-size:18px}
    .p{font-size:22px;font-weight:600;fill:#6b7078}
  </style>
  <rect width="720" height="444" rx="16" fill="#f5f6f6"/>
  <rect x="32" y="32" width="656" height="380" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="h" x="60" y="78">멈추기 · 나가기 · 다시 열기</text>

  <!-- Esc: stop (caution) -->
  <rect x="60" y="109" width="68" height="40" rx="8" fill="#ead9b5"/>
  <rect x="60" y="106" width="68" height="40" rx="8" fill="#f8efdc" stroke="#a3720a" stroke-width="1.5"/>
  <text class="k" x="94" y="132" text-anchor="middle" style="fill:#a3720a">esc</text>
  <text class="l" x="284" y="133">하던 일 멈추기 <tspan class="s" style="font-weight:400">(쓴 내용은 남아요)</tspan></text>

  <!-- /exit + Enter -->
  <rect x="60" y="160" width="80" height="40" rx="8" fill="#f5f6f6" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="c" x="100" y="186" text-anchor="middle">/exit</text>
  <text class="p" x="156" y="188" text-anchor="middle">+</text>
  <rect x="172" y="163" width="80" height="40" rx="8" fill="#e4e4e8"/>
  <rect x="172" y="160" width="80" height="40" rx="8" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
  <text class="k" x="212" y="186" text-anchor="middle">return</text>
  <text class="l" x="284" y="187">Claude 닫기</text>

  <!-- Ctrl + C x2 -->
  <rect x="60" y="217" width="84" height="40" rx="8" fill="#e4e4e8"/>
  <rect x="60" y="214" width="84" height="40" rx="8" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
  <text class="k" x="102" y="240" text-anchor="middle">control</text>
  <text class="p" x="160" y="242" text-anchor="middle">+</text>
  <rect x="176" y="217" width="44" height="40" rx="8" fill="#e4e4e8"/>
  <rect x="176" y="214" width="44" height="40" rx="8" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
  <text class="k" x="198" y="240" text-anchor="middle">C</text>
  <text x="232" y="241" style="font-size:20px;font-weight:700">×2</text>
  <text class="l" x="284" y="241">빈 칸에서 닫기</text>

  <path d="M60 276 H660" stroke="#e4e4e8" stroke-width="1.5"/>

  <!-- come back -->
  <rect x="60" y="298" width="132" height="40" rx="8" fill="#f5f6f6" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="c" x="126" y="324" text-anchor="middle">ilson chat</text>
  <text class="l" x="284" y="325">다시 열기</text>

  <rect x="60" y="352" width="104" height="40" rx="8" fill="#f5f6f6" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="c" x="112" y="378" text-anchor="middle">/resume</text>
  <text class="l" x="284" y="379">지난 대화 이어 가기</text>
</svg>
