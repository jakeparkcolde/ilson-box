<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" width="720" height="404" role="img" aria-label="폴더를 믿을지 묻는 질문에서 일손 폴더와 내가 만든 작업 폴더는 예, 홈 폴더와 인터넷에서 받은 폴더는 아니요를 고르는 판단 그림">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7078" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .q{font-size:22px;font-weight:600}
    .h{font-size:20px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .mp{font-family:'SF Mono',Menlo,monospace;font-size:18px;fill:#6b7078}
    .yes{font-size:20px;font-weight:700;fill:#1d8a38}
    .no{font-size:20px;font-weight:700;fill:#c4423b}
    .card{fill:#ffffff;stroke:#e4e4e8;stroke-width:1.5}
    .ln{stroke:#6b7078;stroke-width:2;fill:none}
  </style>
  <rect width="720" height="404" rx="16" fill="#f5f6f6"/>

  <!-- question -->
  <rect x="235" y="28" width="250" height="52" rx="26" fill="#ffffff" stroke="#5e6ad2" stroke-width="2"/>
  <text class="q" x="360" y="62" text-anchor="middle">이 폴더를 믿을까요?</text>

  <path class="ln" d="M360 80 V104 M136 104 H584"/>
  <path class="ln" d="M136 104 V126" marker-end="url(#arrow)"/>
  <path class="ln" d="M360 104 V126" marker-end="url(#arrow)"/>
  <path class="ln" d="M584 104 V126" marker-end="url(#arrow)"/>

  <!-- box folder -->
  <rect class="card" x="36" y="134" width="200" height="178" rx="14"/>
  <text class="h" x="136" y="172" text-anchor="middle">일손 폴더</text>
  <text class="mp" x="136" y="202" text-anchor="middle">~/ilson</text>
  <rect x="98" y="220" width="76" height="36" rx="18" fill="#e6f3e9" stroke="#1d8a38" stroke-width="1.5"/>
  <text class="yes" x="136" y="245" text-anchor="middle">예</text>
  <text class="s" x="136" y="290" text-anchor="middle">12강</text>

  <!-- the work folder I made (new in this lesson) -->
  <rect x="260" y="134" width="200" height="178" rx="14" fill="#e8eafb" stroke="#5e6ad2" stroke-width="1.5"/>
  <text class="h" x="360" y="172" text-anchor="middle">내가 만든 작업 폴더</text>
  <text class="mp" x="360" y="202" text-anchor="middle">~/Projects/…</text>
  <rect x="322" y="220" width="76" height="36" rx="18" fill="#e6f3e9" stroke="#1d8a38" stroke-width="1.5"/>
  <text class="yes" x="360" y="245" text-anchor="middle">예</text>
  <text class="s" x="360" y="290" text-anchor="middle">심화 2강</text>

  <!-- home folder and downloaded folders -->
  <rect class="card" x="484" y="134" width="200" height="178" rx="14"/>
  <text class="h" x="584" y="172" text-anchor="middle">홈 폴더 · 받은 폴더</text>
  <text class="mp" x="584" y="202" text-anchor="middle">~</text>
  <rect x="534" y="220" width="100" height="36" rx="18" fill="#f8e3e1" stroke="#c4423b" stroke-width="1.5"/>
  <text class="no" x="584" y="245" text-anchor="middle">아니요</text>
</svg>
