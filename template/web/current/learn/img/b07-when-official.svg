<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 426" width="720" height="426" role="img" aria-label="질문이 법·세금·건강·돈에 관한 것이면 공식 기관 확인으로, 가게 글이나 아이디어면 직접 읽고 고쳐 쓰기로 가는 선택 그림">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7078" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .l{font-size:21px;font-weight:600}
    .h{font-size:20px;font-weight:600}
    .a{font-size:20px;font-weight:700}
    .b{font-size:20px}
    .s{font-size:18px;fill:#6b7078}
  </style>
  <rect width="720" height="426" rx="16" fill="#f5f6f6"/>

  <!-- question -->
  <rect x="170" y="24" width="380" height="60" rx="30" fill="#e8eafb" stroke="#5e6ad2" stroke-width="1.5"/>
  <text class="l" x="360" y="61" text-anchor="middle">이 질문, 틀리면 손해가 큰가요?</text>

  <!-- branches -->
  <path d="M290 86 C290 112 188 108 188 134" stroke="#6b7078" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M430 86 C430 112 532 108 532 134" stroke="#6b7078" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="217" y="96" width="44" height="28" rx="14" fill="#f5f6f6"/>
  <text class="h" x="239" y="117" text-anchor="middle" style="fill:#a3720a">예</text>
  <rect x="445" y="96" width="72" height="28" rx="14" fill="#f5f6f6"/>
  <text class="h" x="481" y="117" text-anchor="middle" style="fill:#1d8a38">아니요</text>

  <!-- left: high stakes -->
  <rect x="32" y="142" width="312" height="184" rx="14" fill="#ffffff"/>
  <path d="M46 142 H330 A14 14 0 0 1 344 156 V188 H32 V156 A14 14 0 0 1 46 142 Z" fill="#f8efdc"/>
  <rect x="32" y="142" width="312" height="184" rx="14" fill="none" stroke="#a3720a" stroke-width="2"/>
  <text class="h" x="188" y="172" text-anchor="middle" style="fill:#a3720a">법·허가·세금·건강·돈</text>
  <g fill="none" stroke="#a3720a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M162 212 L188 198 L214 212 Z"/>
    <path d="M170 217 V238 M182 217 V238 M194 217 V238 M206 217 V238"/>
    <path d="M160 244 H216"/>
  </g>
  <text class="a" x="188" y="278" text-anchor="middle">공식 기관·전문가에게 최종 확인</text>
  <text class="s" x="188" y="306" text-anchor="middle">구청·시청, 국세청 등</text>

  <!-- right: low stakes -->
  <rect x="376" y="142" width="312" height="184" rx="14" fill="#ffffff"/>
  <path d="M390 142 H674 A14 14 0 0 1 688 156 V188 H376 V156 A14 14 0 0 1 390 142 Z" fill="#e6f3e9"/>
  <rect x="376" y="142" width="312" height="184" rx="14" fill="none" stroke="#1d8a38" stroke-width="2"/>
  <text class="h" x="532" y="172" text-anchor="middle" style="fill:#1d8a38">가게 글·아이디어·정리</text>
  <g transform="translate(538 218) rotate(45)">
    <rect x="-6" y="-24" width="12" height="32" rx="2" fill="#ffffff" stroke="#1d8a38" stroke-width="2.5"/>
    <path d="M-6 8 L0 19 L6 8 Z" fill="#1d8a38" stroke="#1d8a38" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <path d="M506 244 H536" stroke="#1d8a38" stroke-width="2.5" stroke-linecap="round"/>
  <text class="a" x="532" y="278" text-anchor="middle">직접 읽어 보고 고쳐 써요</text>

  <!-- always -->
  <rect x="32" y="346" width="656" height="56" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="b" x="360" y="381" text-anchor="middle"><tspan font-weight="700">어느 쪽이든:</tspan> 근거 묻기 · 확인·추측 가르기 · 숫자 다시 계산</text>
</svg>
