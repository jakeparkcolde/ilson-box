<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" width="720" height="456" role="img" aria-label="rm 명령 앞에서 Do you want to proceed? 질문과 Yes, No 같은 선택지가 나온 터미널 스케치에 한국어 뜻을 단 그림">
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .m{font-family:'SF Mono',Menlo,monospace;font-size:18px;fill:#f7f8f8}
    .r{font-size:18px}
    .s{font-size:18px;fill:#6b7078}
    .n{font-size:18px;font-weight:700;fill:#ffffff}
    .ld{stroke:#b8bcc2;stroke-width:1.5}
  </style>
  <rect width="720" height="456" rx="16" fill="#f5f6f6"/>

  <!-- terminal -->
  <rect x="32" y="32" width="400" height="372" rx="12" fill="#1d1d21"/>
  <circle cx="54" cy="54" r="5" fill="#62666d"/><circle cx="72" cy="54" r="5" fill="#62666d"/><circle cx="90" cy="54" r="5" fill="#62666d"/>
  <text x="232" y="61" text-anchor="middle" style="font-size:18px;fill:#9aa0a8">터미널</text>
  <path d="M32 76 H432" stroke="#2c2e34" stroke-width="1.5"/>

  <text class="m" x="48" y="114">rm vault/company/<tspan style="font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif">가격표-연습.md</tspan></text>
  <path d="M235 123 H351" stroke="#a3720a" stroke-width="3" stroke-linecap="round"/>

  <text class="m" x="48" y="172">Do you want to proceed?</text>
  <text class="m" x="70" y="218" style="fill:#c9ccd1">Yes</text>
  <text class="m" x="70" y="264" style="fill:#c9ccd1">Yes, and don't ask again for: …</text>
  <rect x="44" y="298" width="376" height="34" rx="6" fill="#5e6ad2" fill-opacity="0.22" stroke="#a7b0ff" stroke-width="2"/>
  <text class="m" x="70" y="321" style="font-weight:700">No</text>
  <text class="m" x="48" y="378" style="fill:#9aa0a8">Esc to cancel · Tab to amend</text>

  <!-- glosses -->
  <path class="ld" d="M436 108 H452"/>
  <circle cx="470" cy="108" r="14" fill="#5e6ad2"/><text class="n" x="470" y="114" text-anchor="middle">1</text>
  <text class="r" x="492" y="104" style="font-weight:600">실행하려는 명령 ·</text>
  <text class="r" x="492" y="128" style="font-weight:600">파일 이름부터 읽기</text>

  <path class="ld" d="M436 166 H452"/>
  <text class="r" x="458" y="172">진행할까요?</text>

  <path class="ld" d="M436 212 H452"/>
  <text class="r" x="458" y="218">이번만 허락</text>

  <path class="ld" d="M436 258 H452"/>
  <text class="r" x="458" y="256">같은 종류 다시 묻지 않기</text>
  <text x="458" y="280" style="font-size:18px;fill:#a3720a">(지우기엔 고르지 않기)</text>

  <path class="ld" d="M436 315 H452"/>
  <circle cx="470" cy="315" r="14" fill="#5e6ad2"/><text class="n" x="470" y="321" text-anchor="middle">2</text>
  <text x="492" y="311" style="font-size:18px;font-weight:600;fill:#5e6ad2">이번 연습에서 고를 답 ·</text>
  <text x="492" y="335" style="font-size:18px;font-weight:600;fill:#5e6ad2">거절</text>

  <path class="ld" d="M436 372 H452"/>
  <text class="r" x="458" y="378">취소 · 메모 붙여 답하기</text>

  <text class="s" x="648" y="436" text-anchor="end">실제 화면은 조금 다를 수 있어요</text>
</svg>
