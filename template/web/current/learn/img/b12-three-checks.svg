<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" role="img" aria-label="상태 카드의 세 칸 가운데 Claude 로그인과 회사 폴더 신뢰는 이번 강, 회사 정보는 15강에서 채운다는 표시">
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .l{font-size:21px;font-weight:600}
    .st{font-size:18px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
  </style>
  <rect width="720" height="336" rx="16" fill="#f5f6f6"/>
  <rect x="32" y="32" width="656" height="272" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>

  <!-- header -->
  <path d="M56 72 H62 L67 60 L74 84 L79 72 H86" fill="none" stroke="#6b7078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="l" x="98" y="79">내 일손박스 지금 상태</text>
  <rect x="554" y="53" width="110" height="38" rx="10" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
  <text class="st" x="609" y="78" text-anchor="middle">다시 확인</text>
  <path d="M32 112 H688" stroke="#e4e4e8" stroke-width="1.5"/>

  <!-- row 1 -->
  <rect x="56" y="127" width="128" height="34" rx="17" fill="#e6f3e9"/>
  <circle cx="78" cy="144" r="8" fill="none" stroke="#1d8a38" stroke-width="2"/>
  <path d="M74 144 L77 147 L82 141" fill="none" stroke="#1d8a38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="st" x="94" y="150" style="fill:#1d8a38">됐어요</text>
  <text class="l" x="208" y="151">Claude 로그인</text>
  <rect x="592" y="128" width="72" height="32" rx="16" fill="#f5f6f6" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="s" x="628" y="150" text-anchor="middle">12강</text>
  <path d="M56 176 H664" stroke="#e4e4e8" stroke-width="1.5"/>

  <!-- row 2 -->
  <rect x="56" y="191" width="128" height="34" rx="17" fill="#e6f3e9"/>
  <circle cx="78" cy="208" r="8" fill="none" stroke="#1d8a38" stroke-width="2"/>
  <path d="M74 208 L77 211 L82 205" fill="none" stroke="#1d8a38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="st" x="94" y="214" style="fill:#1d8a38">됐어요</text>
  <text class="l" x="208" y="215">회사 폴더 신뢰</text>
  <rect x="592" y="192" width="72" height="32" rx="16" fill="#f5f6f6" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="s" x="628" y="214" text-anchor="middle">12강</text>
  <path d="M56 240 H664" stroke="#e4e4e8" stroke-width="1.5"/>

  <!-- row 3 -->
  <rect x="56" y="255" width="128" height="34" rx="17" fill="#f8efdc"/>
  <circle cx="78" cy="272" r="8" fill="none" stroke="#a3720a" stroke-width="2"/>
  <path d="M78 267.5 V273" stroke="#a3720a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="78" cy="276.5" r="1.3" fill="#a3720a"/>
  <text class="st" x="94" y="278" style="fill:#a3720a">확인 필요</text>
  <text class="l" x="208" y="279">회사 정보</text>
  <rect x="510" y="256" width="154" height="32" rx="16" fill="#e8eafb"/>
  <text class="st" x="587" y="278" text-anchor="middle" style="fill:#5e6ad2">15강에서 채워요</text>
</svg>
