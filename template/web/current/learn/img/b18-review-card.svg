<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" width="720" height="476" role="img" aria-label="스킬이나 플러그인을 들이기 전에 출처, 쓰이는 때, 설치하는 프로그램, 인터넷 연결, 읽고 쓰는 파일, 빼는 법, 걱정되는 점을 확인하는 일곱 줄 확인표 카드">
  <defs>
    <symbol id="box" viewBox="0 0 20 20"><rect x="1" y="1" width="18" height="18" rx="5" fill="#ffffff" stroke="#c9ccd1" stroke-width="2"/></symbol>
    <symbol id="warn" viewBox="0 0 18 18"><path d="M9 1.5 L17 16 H1 Z" fill="#a3720a" stroke="#a3720a" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 6.5 V10.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="13.3" r="1.2" fill="#ffffff"/></symbol>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .t{font-size:24px;font-weight:700}
    .l{font-size:20px;font-weight:600}
    .r{font-size:20px}
    .no{font-size:20px;font-weight:700;fill:#5e6ad2}
    .ss{font-size:18px;font-weight:600;fill:#a3720a}
    .sep{stroke:#eceef0;stroke-width:1.5}
    .amb{fill:#f8efdc}
  </style>
  <rect width="720" height="476" rx="16" fill="#f5f6f6"/>

  <rect x="32" y="24" width="624" height="366" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="t" x="56" y="62">들이기 전 확인표</text>
  <path d="M32 80 H656" stroke="#e4e4e8" stroke-width="1.5"/>

  <!-- row 1 -->
  <use href="#box" x="56" y="97" width="20" height="20"/>
  <text class="no" x="98" y="114" text-anchor="middle">1</text>
  <text class="r" x="120" y="114">출처 · 누가 만들었나요</text>
  <path class="sep" d="M56 128 H632"/>

  <!-- row 2 -->
  <use href="#box" x="56" y="139" width="20" height="20"/>
  <text class="no" x="98" y="156" text-anchor="middle">2</text>
  <text class="r" x="120" y="156">언제 쓰이나요</text>

  <!-- row 3 (careful) -->
  <rect class="amb" x="44" y="173" width="600" height="36" rx="8"/>
  <use href="#box" x="56" y="181" width="20" height="20"/>
  <text class="no" x="98" y="198" text-anchor="middle">3</text>
  <text class="r" x="120" y="198">설치·실행하는 프로그램</text>
  <rect x="532" y="177" width="100" height="28" rx="14" fill="#ffffff" stroke="#a3720a" stroke-width="1.5"/>
  <use href="#warn" x="545" y="182" width="18" height="18"/>
  <text class="ss" x="570" y="198">꼭 보기</text>

  <!-- row 4 (careful) -->
  <rect class="amb" x="44" y="215" width="600" height="36" rx="8"/>
  <use href="#box" x="56" y="223" width="20" height="20"/>
  <text class="no" x="98" y="240" text-anchor="middle">4</text>
  <text class="r" x="120" y="240">인터넷 연결 · 필요한 계정</text>
  <rect x="532" y="219" width="100" height="28" rx="14" fill="#ffffff" stroke="#a3720a" stroke-width="1.5"/>
  <use href="#warn" x="545" y="224" width="18" height="18"/>
  <text class="ss" x="570" y="240">꼭 보기</text>

  <!-- row 5 -->
  <use href="#box" x="56" y="265" width="20" height="20"/>
  <text class="no" x="98" y="282" text-anchor="middle">5</text>
  <text class="r" x="120" y="282">읽고 쓰는 파일</text>
  <path class="sep" d="M56 296 H632"/>

  <!-- row 6 -->
  <use href="#box" x="56" y="307" width="20" height="20"/>
  <text class="no" x="98" y="324" text-anchor="middle">6</text>
  <text class="r" x="120" y="324">빼는 법 · 빼면 멈추는 기능</text>
  <path class="sep" d="M56 338 H632"/>

  <!-- row 7 -->
  <use href="#box" x="56" y="349" width="20" height="20"/>
  <text class="no" x="98" y="366" text-anchor="middle">7</text>
  <text class="r" x="120" y="366">걱정되는 점</text>

  <!-- install only after reading -->
  <rect x="32" y="410" width="290" height="44" rx="22" fill="#e8eafb" stroke="#5e6ad2" stroke-width="1.5"/>
  <text class="l" x="177" y="439" text-anchor="middle">다 읽고 「좋아요」 한 뒤에만 설치</text>
</svg>
