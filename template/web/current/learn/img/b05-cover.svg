<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-label="꽃다발 그림의 네 부분에 받는 분, 주인공, 포장, 가시라는 이름표를 붙여 좋은 부탁의 네 가지를 보여 주는 그림">
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .t{font-size:26px;font-weight:700}
    .w{font-size:22px;font-weight:700}
    .s{font-size:18px;fill:#6b7078}
    .n{font-size:18px;font-weight:700;fill:#ffffff}
  </style>
  <rect width="720" height="460" rx="16" fill="#f5f6f6"/>
  <text class="t" x="360" y="54" text-anchor="middle">꽃다발처럼 부탁하기</text>

  <!-- wrapping paper, back panel -->
  <path d="M262 170 L458 170 L384 338 L336 338 Z" fill="#eceef0" stroke="#c9ccd2" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- stems behind flowers -->
  <path d="M360 150 V300 M304 190 L350 300 M416 190 L370 300" stroke="#9da2a9" stroke-width="3" stroke-linecap="round"/>

  <!-- leaves -->
  <ellipse cx="320" cy="158" rx="26" ry="10" transform="rotate(-35 320 158)" fill="#dfe2e6" stroke="#b9bdc3" stroke-width="1.5"/>
  <ellipse cx="400" cy="158" rx="26" ry="10" transform="rotate(35 400 158)" fill="#dfe2e6" stroke="#b9bdc3" stroke-width="1.5"/>

  <!-- small flower, soft accent -->
  <g fill="#e8eafb" stroke="#5e6ad2" stroke-width="1.5">
    <circle cx="304" cy="169" r="13"/>
    <circle cx="318.3" cy="179.4" r="13"/>
    <circle cx="312.8" cy="196.1" r="13"/>
    <circle cx="295.2" cy="196.1" r="13"/>
    <circle cx="289.7" cy="179.4" r="13"/>
  </g>
  <circle cx="304" cy="184" r="7" fill="#ffffff" stroke="#5e6ad2" stroke-width="1.5"/>

  <!-- small flower, grey -->
  <g fill="#ffffff" stroke="#b9bdc3" stroke-width="1.5">
    <circle cx="416" cy="169" r="13"/>
    <circle cx="430.3" cy="179.4" r="13"/>
    <circle cx="424.8" cy="196.1" r="13"/>
    <circle cx="407.2" cy="196.1" r="13"/>
    <circle cx="401.7" cy="179.4" r="13"/>
  </g>
  <circle cx="416" cy="184" r="7" fill="#e4e4e8"/>

  <!-- main flower, accent (the 주인공) -->
  <g fill="#5e6ad2">
    <circle cx="383" cy="140" r="19"/>
    <circle cx="371.5" cy="159.9" r="19"/>
    <circle cx="348.5" cy="159.9" r="19"/>
    <circle cx="337" cy="140" r="19"/>
    <circle cx="348.5" cy="120.1" r="19"/>
    <circle cx="371.5" cy="120.1" r="19"/>
  </g>
  <circle cx="360" cy="140" r="13" fill="#ffffff"/>
  <circle cx="360" cy="140" r="5" fill="#5e6ad2"/>

  <!-- wrapping paper, front panel (the 포장) -->
  <path d="M282 206 L360 228 L438 206 L384 338 L336 338 Z" fill="#ffffff" stroke="#c9ccd2" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M360 228 L360 338" stroke="#e4e4e8" stroke-width="1.5"/>

  <!-- ribbon bow -->
  <path d="M360 316 C338 298 328 330 360 316 Z M360 316 C382 298 392 330 360 316 Z" fill="#ffffff" stroke="#6b7078" stroke-width="2" stroke-linejoin="round"/>
  <path d="M357 319 L349 336 M363 319 L371 336" stroke="#6b7078" stroke-width="2" stroke-linecap="round"/>
  <circle cx="360" cy="316" r="4.5" fill="#6b7078"/>

  <!-- gift tag (the 받는 분) -->
  <path d="M243 228 Q258 206 276 192" fill="none" stroke="#9da2a9" stroke-width="1.5"/>
  <g transform="translate(224 232) rotate(-14)">
    <path d="M-30 -16 H18 L31 0 L18 16 H-30 A4 4 0 0 1 -34 12 V-12 A4 4 0 0 1 -30 -16 Z" fill="#ffffff" stroke="#6b7078" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="19" cy="0" r="3.5" fill="#f5f6f6" stroke="#6b7078" stroke-width="1.5"/>
    <rect x="-25" y="-6" width="30" height="4" rx="2" fill="#c9ccd2"/>
    <rect x="-25" y="3" width="20" height="4" rx="2" fill="#c9ccd2"/>
  </g>

  <!-- stem with thorns (the 가시) -->
  <path d="M360 338 V424" stroke="#6b7078" stroke-width="5" stroke-linecap="round"/>
  <path d="M362.5 357 L375 352 L362.5 365 Z" fill="#6b7078"/>
  <path d="M357.5 387 L344 382 L357.5 395 Z" fill="#c4423b"/>
  <path d="M352 375 V405" stroke="#c4423b" stroke-width="2" stroke-dasharray="4 3"/>
  <g stroke="#c4423b" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M306 386 L336 400 M306 400 L336 386"/>
    <circle cx="300" cy="382" r="6"/>
    <circle cx="300" cy="404" r="6"/>
  </g>

  <!-- leader lines -->
  <g stroke="#9da2a9" stroke-width="1.5" fill="none">
    <path d="M206 170 L214 212"/>
    <path d="M480 131 L408 138"/>
    <path d="M480 379 L400 302"/>
    <path d="M240 379 L284 389"/>
  </g>
  <g fill="#6b7078">
    <circle cx="214" cy="213" r="3.5"/>
    <circle cx="406" cy="138" r="3.5"/>
    <circle cx="400" cy="302" r="3.5"/>
    <circle cx="285" cy="389" r="3.5"/>
  </g>

  <!-- 1 받는 분 (top left) -->
  <rect x="32" y="92" width="208" height="78" rx="12" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <circle cx="60" cy="120" r="14" fill="#5e6ad2"/><text class="n" x="60" y="126" text-anchor="middle">1</text>
  <text class="w" x="84" y="128">받는 분</text>
  <text class="s" x="84" y="156">누가 읽나요?</text>

  <!-- 2 주인공 (top right) -->
  <rect x="480" y="92" width="208" height="78" rx="12" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <circle cx="508" cy="120" r="14" fill="#5e6ad2"/><text class="n" x="508" y="126" text-anchor="middle">2</text>
  <text class="w" x="532" y="128">주인공</text>
  <text class="s" x="532" y="156">꼭 들어갈 내용</text>

  <!-- 3 포장 (bottom right) -->
  <rect x="480" y="340" width="208" height="78" rx="12" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <circle cx="508" cy="368" r="14" fill="#5e6ad2"/><text class="n" x="508" y="374" text-anchor="middle">3</text>
  <text class="w" x="532" y="376">포장</text>
  <text class="s" x="532" y="404">길이·말투·모양</text>

  <!-- 4 가시 (bottom left) -->
  <rect x="32" y="340" width="208" height="78" rx="12" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <circle cx="60" cy="368" r="14" fill="#5e6ad2"/><text class="n" x="60" y="374" text-anchor="middle">4</text>
  <text class="w" x="84" y="376" style="fill:#c4423b">가시</text>
  <text class="s" x="84" y="404">빼거나 조심할 것</text>
</svg>
