<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-label="Claude를 만나는 세 가지 길인 브라우저·앱, Claude Code, 일손박스를 나란히 비교한 그림">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7078" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .l{font-size:22px;font-weight:600}
    .b{font-size:18px}
    .s{font-size:18px;fill:#6b7078}
    .m{font-family:'SF Mono',Menlo,monospace;font-size:20px;fill:#a7b0ff}
  </style>
  <rect width="720" height="460" rx="16" fill="#f5f6f6"/>

  <!-- card 1: browser and apps -->
  <rect x="32" y="32" width="208" height="352" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="l" x="136" y="66" text-anchor="middle">① 브라우저·앱</text>
  <rect x="90" y="82" width="76" height="52" rx="7" fill="#ffffff" stroke="#6b7078" stroke-width="2"/>
  <path d="M90 96 H 166" stroke="#6b7078" stroke-width="2"/>
  <circle cx="99" cy="89" r="2.5" fill="#6b7078"/><circle cx="107" cy="89" r="2.5" fill="#6b7078"/><circle cx="115" cy="89" r="2.5" fill="#6b7078"/>
  <rect x="100" y="106" width="42" height="8" rx="4" fill="#e4e4e8"/>
  <rect x="100" y="119" width="28" height="8" rx="4" fill="#e4e4e8"/>
  <rect x="154" y="92" width="32" height="50" rx="7" fill="#ffffff" stroke="#6b7078" stroke-width="2"/>
  <path d="M164 135 H 176" stroke="#6b7078" stroke-width="2" stroke-linecap="round"/>
  <text class="b" x="136" y="172" text-anchor="middle">claude.ai</text>
  <text class="b" x="136" y="194" text-anchor="middle">데스크톱 · 휴대폰</text>
  <text class="b" x="136" y="220" text-anchor="middle">대화로 글쓰기·정리</text>
  <rect x="78" y="314" width="116" height="34" rx="17" fill="#e6f3e9" stroke="#1d8a38" stroke-width="1.5"/>
  <text class="b" x="136" y="337" text-anchor="middle" style="fill:#1d8a38">무료로 시작</text>
  <text class="s" x="136" y="370" text-anchor="middle">1~2부</text>

  <!-- card 2: Claude Code -->
  <rect x="256" y="32" width="208" height="352" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="l" x="360" y="66" text-anchor="middle">② Claude Code</text>
  <rect x="308" y="82" width="104" height="60" rx="9" fill="#1d1d21"/>
  <circle cx="322" cy="95" r="4" fill="#62666d"/><circle cx="335" cy="95" r="4" fill="#62666d"/><circle cx="348" cy="95" r="4" fill="#62666d"/>
  <text class="m" x="324" y="128">&gt;_</text>
  <text class="b" x="360" y="172" text-anchor="middle">Mac 터미널에서</text>
  <text class="b" x="360" y="194" text-anchor="middle">파일을 읽고 만들어요</text>
  <rect x="308" y="314" width="104" height="34" rx="17" fill="#ffffff" stroke="#5e6ad2" stroke-width="1.5"/>
  <text class="b" x="360" y="337" text-anchor="middle" style="fill:#5e6ad2">Pro 이상</text>
  <text class="s" x="360" y="370" text-anchor="middle">3부</text>

  <!-- card 3: ilson box (our path) -->
  <rect x="480" y="32" width="208" height="352" rx="14" fill="#e8eafb" stroke="#5e6ad2" stroke-width="2"/>
  <text class="l" x="584" y="66" text-anchor="middle">③ 일손박스</text>
  <!-- open box holding shop files (folder) and schedule (calendar) -->
  <g transform="translate(0 4)">
  <path d="M551 84 H 566 L 572 91 H 590 V 122 H 551 Z" fill="#ffffff" stroke="#6b7078" stroke-width="2" stroke-linejoin="round"/>
  <rect x="590" y="82" width="34" height="38" rx="5" fill="#ffffff" stroke="#6b7078" stroke-width="2"/>
  <path d="M590 92 H 624" stroke="#6b7078" stroke-width="2"/>
  <path d="M599 77 V 86 M615 77 V 86" stroke="#6b7078" stroke-width="2" stroke-linecap="round"/>
  <rect x="597" y="98" width="7" height="6" rx="1.5" fill="#5e6ad2"/>
  <rect x="608" y="98" width="7" height="6" rx="1.5" fill="#e4e4e8"/>
  <path d="M540 112 L 528 98 M628 112 L 640 98" stroke="#6b7078" stroke-width="2" stroke-linecap="round"/>
  <rect x="540" y="110" width="88" height="34" rx="6" fill="#ffffff" stroke="#6b7078" stroke-width="2"/>
  <rect x="568" y="123" width="32" height="8" rx="4" fill="#e4e4e8"/>
  </g>
  <text class="b" x="584" y="172" text-anchor="middle">Mac에 설치한 일손 도구</text>
  <text class="b" x="584" y="198" text-anchor="middle">가게 자료 폴더</text>
  <text class="b" x="584" y="220" text-anchor="middle">+ Claude Code</text>
  <text class="b" x="584" y="246" text-anchor="middle">정해진 시간에</text>
  <text class="b" x="584" y="268" text-anchor="middle">할 일 맡기기</text>
  <text class="b" x="584" y="294" text-anchor="middle">결과는 관리 화면에서</text>
  <rect x="532" y="314" width="104" height="34" rx="17" fill="#ffffff" stroke="#5e6ad2" stroke-width="1.5"/>
  <text class="b" x="584" y="337" text-anchor="middle" style="fill:#5e6ad2">Pro 이상</text>
  <text class="s" x="584" y="370" text-anchor="middle">3~4부</text>

  <!-- Claude Code works inside ilson box -->
  <path d="M360 390 C 360 426, 584 426, 584 394" fill="none" stroke="#6b7078" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="404" y="401" width="136" height="34" rx="17" fill="#f5f6f6"/>
  <text class="l" x="472" y="425" text-anchor="middle" style="font-size:20px">안에서 일해요</text>
</svg>
