<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" width="720" height="468" role="img" aria-label="터미널과 왼쪽 메뉴 일곱 칸을 할 일과 짝지어, 바로 쓰는 곳, 설정이 필요한 곳, 둘러보기만 하는 곳을 색으로 나눈 지도">
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .g{font-size:20px;font-weight:600;fill:#6b7078}
    .n{font-size:20px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .k{font-size:18px;font-weight:600}
    .m{font-family:'SF Mono',Menlo,monospace}
    .panel{fill:#ffffff;stroke:#e4e4e8;stroke-width:1.5}
    .ok{fill:#e6f3e9}
    .wait{fill:#f8efdc}
    .look{fill:#f5f6f6}
    .chip{fill:#ffffff}
  </style>
  <rect width="720" height="468" rx="16" fill="#f5f6f6"/>

  <!-- terminal -->
  <rect x="32" y="32" width="656" height="56" rx="14" fill="#e8eafb" stroke="#5e6ad2" stroke-width="1.5"/>
  <rect x="52" y="44" width="44" height="32" rx="8" fill="#1d1d21"/>
  <text class="m" x="74" y="66" text-anchor="middle" style="font-size:18px;fill:#a7b0ff">&gt;_</text>
  <text x="110" y="68" style="font-size:22px;font-weight:700">터미널</text>
  <text class="m" x="190" y="68" style="font-size:20px">ilson chat</text>
  <text x="668" y="68" text-anchor="end" style="font-size:20px">말로 맡기고 · 만들고 · 고치기</text>

  <!-- group: 일 -->
  <rect x="32" y="104" width="316" height="278" rx="14" class="panel"/>
  <path d="M46 104.75 H334 Q347.25 104.75 347.25 118 V140 H32.75 V118 Q32.75 104.75 46 104.75 Z" fill="#f5f6f6"/>
  <path d="M32.75 140 H347.25" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="g" x="50" y="129">일</text>

  <rect x="44" y="148" width="292" height="70" rx="10" class="wait"/>
  <text class="n" x="60" y="175">SNS 운영</text>
  <rect x="220" y="157" width="104" height="26" rx="13" class="chip"/>
  <circle cx="236" cy="170" r="4.5" fill="#a3720a"/>
  <text class="k" x="248" y="176" style="fill:#a3720a">설정 먼저</text>
  <text class="s" x="60" y="205">게시 일정 · 승인 대기</text>

  <rect x="44" y="224" width="292" height="70" rx="10" class="wait"/>
  <text class="n" x="60" y="251">SNS 계정 관리</text>
  <rect x="220" y="233" width="104" height="26" rx="13" class="chip"/>
  <circle cx="236" cy="246" r="4.5" fill="#a3720a"/>
  <text class="k" x="248" y="252" style="fill:#a3720a">설정 먼저</text>
  <text class="s" x="60" y="281">인스타그램 · 쓰레드 연결</text>

  <rect x="44" y="300" width="292" height="70" rx="10" class="ok"/>
  <text class="n" x="60" y="327">서류함</text>
  <rect x="220" y="309" width="104" height="26" rx="13" class="chip"/>
  <circle cx="236" cy="322" r="4.5" fill="#1d8a38"/>
  <text class="k" x="248" y="328" style="fill:#1d8a38">바로 써요</text>
  <text class="s" x="60" y="357">만든 문서 찾아 읽기</text>

  <!-- group: 플랫폼 -->
  <rect x="372" y="104" width="316" height="278" rx="14" class="panel"/>
  <path d="M386 104.75 H674 Q687.25 104.75 687.25 118 V140 H372.75 V118 Q372.75 104.75 386 104.75 Z" fill="#f5f6f6"/>
  <path d="M372.75 140 H687.25" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="g" x="390" y="129">플랫폼</text>

  <rect x="384" y="148" width="292" height="70" rx="10" class="ok"/>
  <text class="n" x="400" y="175">리서치</text>
  <rect x="560" y="157" width="104" height="26" rx="13" class="chip"/>
  <circle cx="576" cy="170" r="4.5" fill="#1d8a38"/>
  <text class="k" x="588" y="176" style="fill:#1d8a38">바로 써요</text>
  <text class="s" x="400" y="205">웹 자료 찾고 출처 달기</text>

  <rect x="384" y="224" width="292" height="70" rx="10" class="wait"/>
  <text class="n" x="400" y="251">지식 훔치기</text>
  <rect x="560" y="233" width="104" height="26" rx="13" class="chip"/>
  <circle cx="576" cy="246" r="4.5" fill="#a3720a"/>
  <text class="k" x="588" y="252" style="fill:#a3720a">설정 먼저</text>
  <text class="s" x="400" y="281">자료 모으기에 Aside 연결 필요</text>

  <rect x="384" y="300" width="292" height="70" rx="10" class="look"/>
  <text class="n" x="400" y="327">팩 보관함</text>
  <rect x="560" y="309" width="104" height="26" rx="13" class="chip" stroke="#e4e4e8" stroke-width="1.5"/>
  <circle cx="576" cy="322" r="4.5" fill="#6b7078"/>
  <text class="k" x="588" y="328" style="fill:#6b7078">둘러보기</text>
  <text class="s" x="400" y="357">팩 구경 · 대부분 준비 중</text>

  <!-- group: 배우기 -->
  <rect x="32" y="400" width="380" height="44" rx="12" class="panel"/>
  <text class="g" x="50" y="429">배우기</text>
  <path d="M118 410 V434" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="n" x="134" y="429">Claude 배우기</text>
  <rect x="296" y="408" width="104" height="28" rx="14" fill="#e8eafb"/>
  <circle cx="312" cy="422" r="4.5" fill="#5e6ad2"/>
  <text class="k" x="324" y="428" style="fill:#5e6ad2">지금 여기</text>
</svg>
