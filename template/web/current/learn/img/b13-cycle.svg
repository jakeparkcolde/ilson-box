<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="가격표 파일 하나를 만들고, 고치고, 터미널과 서류함에서 다시 여는 세 단계 순환 그림">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b7078" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .l{font-size:21px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .n{font-size:18px;font-weight:700;fill:#ffffff}
  </style>
  <rect width="720" height="420" rx="16" fill="#f5f6f6"/>

  <!-- 1 make -->
  <rect x="230" y="32" width="260" height="86" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <circle cx="328" cy="62" r="14" fill="#5e6ad2"/><text class="n" x="328" y="68" text-anchor="middle">1</text>
  <text class="l" x="350" y="69">만들기</text>
  <text class="s" x="360" y="102" text-anchor="middle">자리와 모양을 정해 부탁</text>

  <!-- centre document -->
  <path d="M282 150 H428 L450 172 V280 Q450 292 438 292 H282 Q270 292 270 280 V162 Q270 150 282 150 Z" fill="#ffffff" stroke="#5e6ad2" stroke-width="1.5"/>
  <path d="M428 150 V166 Q428 172 434 172 H450" fill="#e8eafb" stroke="#5e6ad2" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="352" y="189" text-anchor="middle" style="font-size:20px;font-weight:600">가격표.md</text>
  <path d="M286 204 H434" stroke="#e4e4e8" stroke-width="1.5"/>
  <text x="360" y="234" text-anchor="middle" style="font-size:19px"><tspan style="font-family:'SF Mono',Menlo,monospace">#</tspan> 햇살꽃집 가격표</text>
  <rect x="296" y="250" width="128" height="10" rx="5" fill="#e4e4e8"/>
  <rect x="296" y="268" width="92" height="10" rx="5" fill="#e4e4e8"/>

  <!-- 2 revise -->
  <rect x="472" y="176" width="216" height="110" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <circle cx="548" cy="210" r="14" fill="#5e6ad2"/><text class="n" x="548" y="216" text-anchor="middle">2</text>
  <text class="l" x="570" y="217">고치기</text>
  <text class="s" x="580" y="256" text-anchor="middle">바꿀 곳만 말하기</text>

  <!-- 3 reopen -->
  <rect x="32" y="176" width="216" height="110" rx="14" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <circle cx="99" cy="210" r="14" fill="#5e6ad2"/><text class="n" x="99" y="216" text-anchor="middle">3</text>
  <text class="l" x="121" y="217">다시 열기</text>
  <rect x="50" y="240" width="30" height="24" rx="5" fill="#1d1d21"/>
  <text x="65" y="258" text-anchor="middle" style="font-family:'SF Mono',Menlo,monospace;font-size:18px;font-weight:700;fill:#f7f8f8">&gt;_</text>
  <text class="s" x="86" y="258">터미널 +</text>
  <rect x="158" y="240" width="20" height="24" rx="3" fill="#ffffff" stroke="#6b7078" stroke-width="2"/>
  <path d="M158 252 H178 M164 246 H172 M164 258 H172" stroke="#6b7078" stroke-width="2" stroke-linecap="round"/>
  <text class="s" x="184" y="258">서류함</text>

  <!-- clockwise arrows -->
  <path d="M496 74 C556 74 580 112 580 168" stroke="#6b7078" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M580 294 C580 358 140 358 140 296" stroke="#6b7078" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M140 170 C140 112 164 74 222 74" stroke="#6b7078" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text class="s" x="360" y="394" text-anchor="middle">가격은 '확인 필요'로 비워 둬요</text>
</svg>
