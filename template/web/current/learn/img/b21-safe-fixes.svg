<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356" role="img" aria-label="기다렸다 다시 보내기, 새 대화나 새 창 열기, 와이파이 확인은 해 봐도 되는 방법이고, 지우기·설치·설정 바꾸기·보호 끄기는 멈추고 물을 일로 나눈 비교 그림">
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .h{font-size:22px;font-weight:700}
    .r{font-size:20px;font-weight:500}
  </style>
  <rect width="720" height="356" rx="16" fill="#f5f6f6"/>

  <!-- safe to try -->
  <rect x="32" y="32" width="316" height="258" rx="14" fill="#e6f3e9" stroke="#1d8a38" stroke-width="2"/>
  <text class="h" x="56" y="74" style="fill:#1d8a38">해 봐도 돼요 (두 번까지)</text>
  <path d="M56 96 H 324" stroke="#1d8a38" stroke-opacity="0.3" stroke-width="1.5"/>
  <g fill="#ffffff" stroke="#1d8a38" stroke-width="2">
    <rect x="56" y="121" width="20" height="20" rx="5"/>
    <rect x="56" y="163" width="20" height="20" rx="5"/>
    <rect x="56" y="205" width="20" height="20" rx="5"/>
  </g>
  <g fill="none" stroke="#1d8a38" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M61 131 L 65 135 L 72 127"/>
    <path d="M61 173 L 65 177 L 72 169"/>
    <path d="M61 215 L 65 219 L 72 211"/>
  </g>
  <text class="r" x="88" y="138">몇 분 기다렸다 다시 보내기</text>
  <text class="r" x="88" y="180">새 대화나 새 터미널 창 열기</text>
  <text class="r" x="88" y="222">와이파이 확인하기</text>

  <!-- stop and ask -->
  <rect x="372" y="32" width="316" height="258" rx="14" fill="#f8efdc" stroke="#a3720a" stroke-width="2"/>
  <text class="h" x="396" y="74" style="fill:#a3720a">멈추고 물어요</text>
  <path d="M396 96 H 664" stroke="#a3720a" stroke-opacity="0.3" stroke-width="1.5"/>
  <g fill="#ffffff" stroke="#a3720a" stroke-width="2">
    <rect x="396" y="121" width="20" height="20" rx="5"/>
    <rect x="396" y="163" width="20" height="20" rx="5"/>
    <rect x="396" y="205" width="20" height="20" rx="5"/>
    <rect x="396" y="247" width="20" height="20" rx="5"/>
  </g>
  <g fill="#a3720a">
    <rect x="402" y="127" width="8" height="8" rx="1.5"/>
    <rect x="402" y="169" width="8" height="8" rx="1.5"/>
    <rect x="402" y="211" width="8" height="8" rx="1.5"/>
    <rect x="402" y="253" width="8" height="8" rx="1.5"/>
  </g>
  <text class="r" x="428" y="138">파일·폴더 지우기</text>
  <text class="r" x="428" y="180">프로그램 설치하기</text>
  <text class="r" x="428" y="222">설정 바꾸기</text>
  <text class="r" x="428" y="264">보호 설정 끄기</text>
</svg>
