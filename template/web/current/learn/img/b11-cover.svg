<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="터미널 창에 ilson chat 한 줄을 넣으면 일손 폴더에서 Claude가 열리는 모습을 그린 개념도">
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#5e6ad2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .l{font-size:21px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .m{font-family:'SF Mono',Menlo,monospace;font-size:19px;fill:#f7f8f8}
    .tag{font-size:18px;font-weight:600}
  </style>
  <rect width="720" height="340" rx="16" fill="#f5f6f6"/>

  <!-- terminal window: lines written in turns -->
  <rect x="32" y="32" width="388" height="244" rx="12" fill="#1d1d21"/>
  <circle cx="54" cy="54" r="5" fill="#62666d"/><circle cx="72" cy="54" r="5" fill="#62666d"/><circle cx="90" cy="54" r="5" fill="#62666d"/>
  <text x="226" y="61" text-anchor="middle" style="font-size:18px;fill:#9aa0a8">터미널</text>
  <path d="M32 76 H420" stroke="#2c2e34" stroke-width="1.5"/>
  <!-- faint ruled lines, like a shared notebook -->
  <path d="M48 134 H404 M48 178 H404 M48 222 H404" stroke="#2c2e34" stroke-width="1"/>

  <rect x="48" y="96" width="76" height="30" rx="15" fill="#e8eafb"/>
  <text class="tag" x="86" y="117" text-anchor="middle" style="fill:#5e6ad2">나</text>
  <text class="m" x="138" y="118"><tspan style="fill:#a7b0ff">~ %</tspan> ilson chat</text>

  <rect x="48" y="140" width="76" height="30" rx="15" fill="#33363d"/>
  <text class="tag" x="86" y="161" text-anchor="middle" style="fill:#c9ccd1">컴퓨터</text>
  <rect x="138" y="149" width="214" height="12" rx="6" fill="#43464e"/>

  <rect x="48" y="184" width="76" height="30" rx="15" fill="#e8eafb"/>
  <text class="tag" x="86" y="205" text-anchor="middle" style="fill:#5e6ad2">나</text>
  <rect x="138" y="193" width="120" height="12" rx="6" fill="#43464e"/>

  <rect x="48" y="228" width="76" height="30" rx="15" fill="#33363d"/>
  <text class="tag" x="86" y="249" text-anchor="middle" style="fill:#c9ccd1">컴퓨터</text>
  <rect x="138" y="237" width="250" height="12" rx="6" fill="#43464e"/>

  <text class="s" x="226" y="310" text-anchor="middle">한 줄씩 번갈아 적는 창</text>

  <!-- the one line brings Claude into the folder -->
  <path d="M306 111 H444" stroke="#5e6ad2" stroke-width="2.5" fill="none" marker-end="url(#arrowA)"/>

  <!-- box folder -->
  <path d="M464 32 H540 Q547 32 551 38 L558 48 H676 Q688 48 688 60 V264 Q688 276 676 276 H464 Q452 276 452 264 V44 Q452 32 464 32 Z" fill="#e8eafb" stroke="#5e6ad2" stroke-width="1.5"/>
  <text class="l" x="570" y="92" text-anchor="middle">일손 폴더 <tspan style="font-family:'SF Mono',Menlo,monospace;font-size:20px;font-weight:400">~/ilson</tspan></text>
  <circle cx="570" cy="142" r="34" fill="#5e6ad2"/>
  <text x="570" y="148" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#ffffff">Claude</text>
  <text x="570" y="206" text-anchor="middle" style="font-size:20px;font-weight:600">Claude가 여기서 일해요</text>
  <rect x="490" y="224" width="70" height="34" rx="17" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <text x="525" y="247" text-anchor="middle" style="font-size:18px">규칙</text>
  <rect x="572" y="224" width="86" height="34" rx="17" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <text x="615" y="247" text-anchor="middle" style="font-size:18px">서류함</text>
</svg>
