<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="720" height="436" role="img" aria-label="이 과정을 마친 뒤 가게 일이 먼저면 AI Fluency for small businesses, claude.ai를 더 넓게 쓰려면 Claude 101, 터미널이 궁금하면 Claude Code 101로 가는 배움 길과 이 안내서의 바이브 코딩 심화를 보여 주는 그림">
