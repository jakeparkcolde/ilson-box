<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" role="img" aria-label="기본 과정 1부부터 4부까지 이어지는 길, 옆에 붙은 5부 막혔을 때, 끝에서 이어지는 바이브 코딩 심화를 보여 주는 지도">
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .l{font-size:20px;font-weight:600}
    .s{font-size:18px;fill:#6b7078}
    .n{font-size:20px;font-weight:700;fill:#ffffff}
    .w{font-size:18px;font-weight:700;fill:#ffffff}
  </style>
  <rect width="720" height="392" rx="16" fill="#f5f6f6"/>
  <g transform="translate(0 -64)">

  <!-- road (basic course, continuing to the advanced track) -->
  <path d="M40 208 C 70 208, 70 204, 96 204 S 210 192, 248 192 S 360 208, 400 208 S 510 194, 552 194 S 612 200, 638 200" fill="none" stroke="#e4e4e8" stroke-width="20" stroke-linecap="round"/>
  <path d="M40 208 C 70 208, 70 204, 96 204 S 210 192, 248 192 S 360 208, 400 208 S 510 194, 552 194 S 612 200, 638 200" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

  <!-- side shelf: part 5 (dotted link, dashed box) -->
  <path d="M250 214 V 322" stroke="#6b7078" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <rect x="196" y="322" width="260" height="100" rx="14" fill="#ffffff" stroke="#6b7078" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text class="l" x="326" y="354" text-anchor="middle" style="fill:#6b7078">5부 막혔을 때</text>
  <text class="s" x="326" y="381" text-anchor="middle">언제든 펼쳐 보기</text>
  <text class="s" x="326" y="406" text-anchor="middle">20~22강</text>

  <!-- stops -->
  <g fill="#5e6ad2" stroke="#ffffff" stroke-width="4">
    <circle cx="96" cy="204" r="20"/>
    <circle cx="248" cy="192" r="20"/>
    <circle cx="400" cy="208" r="20"/>
    <circle cx="552" cy="194" r="20"/>
  </g>
  <text class="n" x="96" y="211" text-anchor="middle">1</text>
  <text class="n" x="248" y="199" text-anchor="middle">2</text>
  <text class="n" x="400" y="215" text-anchor="middle">3</text>
  <text class="n" x="552" y="201" text-anchor="middle">4</text>

  <!-- you are here -->
  <rect x="46" y="124" width="100" height="36" rx="18" fill="#5e6ad2"/>
  <path d="M88 159 L 96 172 L 104 159 Z" fill="#5e6ad2"/>
  <text class="w" x="96" y="148" text-anchor="middle">지금 여기</text>

  <!-- stop labels (alternating below / above) -->
  <text class="l" x="96" y="258" text-anchor="middle">1부 시작하기</text>
  <text class="s" x="96" y="284" text-anchor="middle">1~3강</text>
  <text class="l" x="248" y="130" text-anchor="middle">2부 대화하기</text>
  <text class="s" x="248" y="156" text-anchor="middle">4~10강</text>
  <text class="l" x="400" y="262" text-anchor="middle">3부 일손박스에서 쓰기</text>
  <text class="s" x="400" y="288" text-anchor="middle">11~16강</text>
  <text class="l" x="552" y="132" text-anchor="middle">4부 맡기기</text>
  <text class="s" x="552" y="158" text-anchor="middle">17~19강</text>

  <!-- advanced track flag -->
  <path d="M638 202 V 140" stroke="#1d1d21" stroke-width="3" stroke-linecap="round"/>
  <path d="M638 142 L 674 154 L 638 166 Z" fill="#5e6ad2" stroke="#5e6ad2" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="638" cy="203" r="5" fill="#1d1d21"/>
  <text class="l" x="688" y="258" text-anchor="end">바이브 코딩 심화</text>
  </g>
</svg>
