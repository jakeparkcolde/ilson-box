<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 444" width="720" height="444" role="img" aria-label="개인정보 처리방침에 들어갈 처리 목적, 처리·보유 기간, 파기 절차와 방법, 맡기는 곳, 손님의 권리, 담당자 연락처 여섯 줄에 확인 필요와 전문가 확인 표시가 붙은 체크리스트 카드">
  <style>
    text{font-family:'Apple SD Gothic Neo',Pretendard,'Noto Sans KR',sans-serif;fill:#1d1d21}
    .t{font-size:24px;font-weight:700}
    .r{font-size:21px}
    .u{font-size:20px}
    .chip{font-size:18px;font-weight:600;fill:#a3720a}
    .sq{fill:#ffffff;stroke:#6b7078;stroke-width:1.5}
    .cb{fill:#f8efdc;stroke:#a3720a;stroke-width:1.2}
  </style>
  <rect width="720" height="444" rx="16" fill="#f5f6f6"/>

  <rect x="32" y="24" width="560" height="350" rx="16" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.5"/>
  <text class="t" x="58" y="66">개인정보 처리방침의 뼈대</text>
  <path d="M58 86 H566" stroke="#e4e4e8" stroke-width="1.5"/>

  <rect class="sq" x="58" y="111" width="20" height="20" rx="4"/>
  <text class="r" x="92" y="128">처리 목적</text>

  <rect class="sq" x="58" y="155" width="20" height="20" rx="4"/>
  <text class="r" x="92" y="172">처리·보유 기간</text>
  <rect class="cb" x="458" y="150" width="108" height="30" rx="15"/>
  <text class="chip" x="512" y="171" text-anchor="middle">[확인 필요]</text>

  <rect class="sq" x="58" y="199" width="20" height="20" rx="4"/>
  <text class="r" x="92" y="216">파기 절차와 방법</text>

  <rect class="sq" x="58" y="243" width="20" height="20" rx="4"/>
  <text class="r" x="92" y="260">맡기는 곳 (해당할 때)</text>
  <rect class="cb" x="442" y="238" width="124" height="30" rx="15"/>
  <text class="chip" x="504" y="259" text-anchor="middle">[전문가 확인]</text>

  <rect class="sq" x="58" y="287" width="20" height="20" rx="4"/>
  <text class="r" x="92" y="304">손님의 권리와 행사 방법</text>

  <rect class="sq" x="58" y="331" width="20" height="20" rx="4"/>
  <text class="r" x="92" y="348">개인정보 담당자 연락처</text>
  <rect class="cb" x="458" y="326" width="108" height="30" rx="15"/>
  <text class="chip" x="512" y="347" text-anchor="middle">[확인 필요]</text>

  <text class="u" x="32" y="414">빈 곳은 내가 · 법률 판단은 전문가</text>
</svg>
